<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>daw — alexander griffin king miller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory:#FAF8F5; --clay:#E8DDD3; --clay-dark:#8B7968; --terracotta:#C67B5C;
    --stone:#4A4238; --charcoal:#2C2820; --ink:#1C1812;
    --line:rgba(250,248,245,0.08); --line2:rgba(250,248,245,0.16);
    --hdr-w:188px; --lane-h:76px; --ruler-h:34px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Karla', system-ui, sans-serif; background:var(--charcoal); color:var(--ivory);
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none;
    display:flex; flex-direction:column;
  }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  input[type=range] { accent-color:var(--terracotta); }

  /* ---------- nav ---------- */
  nav { padding:0.9rem 1.6rem 0.6rem; flex:none; }
  .nav-content { display:flex; justify-content:space-between; align-items:center; gap:1rem; }
  .logo { font-family:'Cormorant Garamond', serif; font-size:1.1rem; letter-spacing:0.06em; color:var(--ivory); text-decoration:none; white-space:nowrap; }
  .nav-links { display:flex; gap:1.4rem; list-style:none; flex-wrap:wrap; justify-content:flex-end; }
  .nav-links a { color:rgba(250,248,245,0.75); text-decoration:none; font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; padding-bottom:3px; border-bottom:1px solid transparent; }
  .nav-links a:hover, .nav-links a.active { color:var(--ivory); border-color:var(--terracotta); }

  /* ---------- transport ---------- */
  #transport {
    flex:none; display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;
    padding:0.5rem 1.6rem; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    background:rgba(20,17,12,0.5);
  }
  .tbtn {
    height:34px; min-width:34px; padding:0 0.7rem; border:1px solid var(--line2); border-radius:3px;
    font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; color:rgba(250,248,245,0.85);
    display:inline-flex; align-items:center; justify-content:center; gap:0.35rem;
  }
  .tbtn:hover { border-color:var(--terracotta); }
  .tbtn.on { background:var(--terracotta); border-color:var(--terracotta); color:var(--ink); }
  .tbtn.danger.on { background:#b24a3a; border-color:#b24a3a; color:var(--ivory); }
  .tbtn svg { width:14px; height:14px; fill:currentColor; }
  .tgroup { display:flex; align-items:center; gap:0.35rem; }
  .tsep { width:1px; height:24px; background:var(--line2); margin:0 0.3rem; }
  #pos { font-family:'Cormorant Garamond', serif; font-size:1.5rem; font-variant-numeric:tabular-nums; min-width:7.2rem; letter-spacing:0.04em; line-height:1; padding:0 0.3rem; }
  .field { display:flex; align-items:center; gap:0.3rem; font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase; color:rgba(250,248,245,0.55); }
  .field input, .field select {
    font:inherit; color:var(--ivory); background:rgba(0,0,0,0.3); border:1px solid var(--line2); border-radius:3px;
    height:34px; padding:0 0.4rem; font-size:0.9rem; letter-spacing:0; text-transform:none;
  }
  .field input[type=number] { width:4.3rem; text-align:center; }
  .field select { appearance:none; padding-right:0.4rem; }
  #spacer { flex:1; }
  #hint { font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; color:rgba(250,248,245,0.4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:38vw; }

  /* ---------- arrangement ---------- */
  #arr { flex:1; min-height:0; display:grid; grid-template-columns:var(--hdr-w) 1fr; grid-template-rows:var(--ruler-h) 1fr; position:relative; }
  #corner { border-right:1px solid var(--line2); border-bottom:1px solid var(--line2); background:rgba(20,17,12,0.5); display:flex; align-items:center; padding:0 0.7rem; font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:rgba(250,248,245,0.45); }
  #rulerWrap { position:relative; overflow:hidden; border-bottom:1px solid var(--line2); background:rgba(20,17,12,0.5); cursor:text; }
  #ruler { position:absolute; left:0; top:0; height:100%; }
  #ruler canvas { position:absolute; left:0; top:0; height:100%; }
  #loopBar { position:absolute; top:0; height:9px; background:rgba(198,123,92,0.35); border-left:2px solid var(--terracotta); border-right:2px solid var(--terracotta); display:none; pointer-events:none; }
  #loopBar.on { background:var(--terracotta); }
  #hdrs { overflow:hidden; border-right:1px solid var(--line2); background:rgba(20,17,12,0.3); position:relative; }
  #hdrsInner { position:absolute; left:0; top:0; width:100%; }
  #lanesWrap { position:relative; overflow:auto; touch-action:pan-x pan-y; overscroll-behavior:none; background:var(--charcoal); scrollbar-width:thin; scrollbar-color:var(--clay-dark) transparent; }
  #lanes { position:relative; min-width:100%; }
  #grid { position:absolute; left:0; top:0; pointer-events:none; }
  .lane { position:relative; height:var(--lane-h); border-bottom:1px solid var(--line); }
  .lane.over { background:rgba(198,123,92,0.08); }
  .hdr { height:var(--lane-h); border-bottom:1px solid var(--line); padding:0.45rem 0.6rem 0.4rem 0.7rem; display:flex; flex-direction:column; gap:0.3rem; position:relative; }
  .hdr.sel { background:rgba(250,248,245,0.05); }
  .hdr .top { display:flex; align-items:center; gap:0.4rem; }
  .hdr .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .hdr .name { flex:1; font-size:0.8rem; letter-spacing:0.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; outline:0; padding:1px 2px; border-radius:2px; min-width:0; }
  .hdr .name:focus { background:rgba(0,0,0,0.35); }
  .hdr .x { opacity:0.35; font-size:0.9rem; line-height:1; padding:0 2px; }
  .hdr .x:hover { opacity:1; color:#e07a5f; }
  .hdr .mix { display:flex; align-items:center; gap:0.35rem; }
  .ms { width:22px; height:20px; font-size:0.64rem; border:1px solid var(--line2); border-radius:2px; color:rgba(250,248,245,0.6); }
  .ms.on.m { background:#8a6a3a; color:var(--ivory); border-color:#8a6a3a; }
  .ms.on.s { background:#4f7a8a; color:var(--ivory); border-color:#4f7a8a; }
  .hdr input[type=range] { height:14px; min-width:0; }
  .hdr .vol { flex:1; }
  .hdr .pan { width:46px; }
  .hdr .meter { position:absolute; right:0; top:0; bottom:0; width:3px; background:rgba(0,0,0,0.4); }
  .hdr .meter i { position:absolute; left:0; right:0; bottom:0; height:0; background:var(--terracotta); }
  #addTrack { height:var(--lane-h); width:100%; font-size:0.7rem; letter-spacing:0.16em; text-transform:uppercase; color:rgba(250,248,245,0.5); border-bottom:1px solid var(--line); }
  #addTrack:hover { color:var(--ivory); }
  .lane.empty { opacity:0; }

  .clip {
    position:absolute; top:4px; height:calc(var(--lane-h) - 9px); border-radius:4px; overflow:hidden;
    background:var(--c, #6b5a4a); box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35); cursor:grab; touch-action:none;
  }
  .clip.sel { box-shadow:inset 0 0 0 2px var(--ivory), 0 0 0 1px rgba(0,0,0,0.4); }
  .clip canvas { position:absolute; left:0; top:17px; height:calc(100% - 17px); width:100%; opacity:0.85; pointer-events:none; }
  .clip .lbl { position:absolute; left:0; right:0; top:0; height:17px; line-height:17px; padding:0 6px; font-size:0.66rem; letter-spacing:0.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:rgba(0,0,0,0.28); color:var(--ivory); pointer-events:none; }
  .clip .h { position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize; }
  .clip .h.l { left:0; } .clip .h.r { right:0; }
  .clip .h:hover { background:rgba(250,248,245,0.18); }
  .clip.muted { opacity:0.45; }
  #playhead { position:absolute; top:0; width:1px; height:100%; background:var(--ivory); pointer-events:none; z-index:5; box-shadow:0 0 6px rgba(250,248,245,0.6); }
  #rph { position:absolute; top:0; width:1px; height:100%; background:var(--ivory); pointer-events:none; }
  #rph::before { content:''; position:absolute; left:-5px; bottom:0; border:5px solid transparent; border-bottom-color:var(--ivory); }
  #ghost { position:absolute; top:4px; height:calc(var(--lane-h) - 9px); border:1px dashed var(--ivory); border-radius:4px; pointer-events:none; display:none; z-index:6; }

  /* ---------- browser / tray ---------- */
  #tray { flex:none; border-top:1px solid var(--line2); background:rgba(20,17,12,0.55); display:flex; align-items:stretch; max-height:124px; }
  #trayHead { flex:none; width:var(--hdr-w); padding:0.55rem 0.7rem; border-right:1px solid var(--line2); display:flex; flex-direction:column; gap:0.35rem; }
  #trayHead .t { font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:rgba(250,248,245,0.45); }
  #trayHead .tbtn { height:30px; font-size:0.7rem; }
  #samples { flex:1; display:flex; touch-action:pan-x; gap:0.5rem; padding:0.55rem 0.8rem; overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; scrollbar-color:var(--clay-dark) transparent; }
  .smp { flex:none; width:118px; height:88px; border:1px solid var(--line2); border-radius:4px; padding:0.4rem 0.5rem; display:flex; flex-direction:column; gap:0.2rem; cursor:grab; background:rgba(0,0,0,0.25); touch-action:none; position:relative; }
  .smp:hover { border-color:var(--terracotta); }
  .smp .n { font-size:0.72rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .smp .d { font-size:0.62rem; color:rgba(250,248,245,0.45); letter-spacing:0.06em; }
  .smp canvas { width:100%; height:34px; opacity:0.8; }
  .smp .x { position:absolute; right:2px; top:1px; opacity:0.35; font-size:0.85rem; line-height:1; }
  .smp .x:hover { opacity:1; }
  #emptyTray { align-self:center; font-size:0.72rem; letter-spacing:0.08em; color:rgba(250,248,245,0.4); padding:0 0.6rem; }

  #banner { position:fixed; left:50%; bottom:140px; transform:translateX(-50%); background:rgba(20,17,12,0.92); border:1px solid var(--line2); padding:0.5rem 0.9rem; font-size:0.78rem; letter-spacing:0.04em; border-radius:4px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; max-width:80vw; text-align:center; }
  #banner.show { opacity:1; }
  body.dropping::after { content:'drop audio to add it'; position:fixed; inset:0; background:rgba(198,123,92,0.18); border:3px dashed var(--terracotta); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond', serif; font-size:2.2rem; pointer-events:none; z-index:60; }

  /* ---------- record / midi ---------- */
  #btnRec.on { background:#b24a3a; border-color:#b24a3a; color:var(--ivory); }
  #btnRec.live { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { background:#e0604a; border-color:#e0604a; } }
  .hdr .kind { font-size:0.56rem; letter-spacing:0.12em; text-transform:uppercase; color:rgba(250,248,245,0.45); padding:1px 4px; border:1px solid var(--line2); border-radius:2px; flex:none; }
  .hdr select.inst { font:inherit; font-size:0.66rem; color:var(--ivory); background:rgba(0,0,0,0.35); border:1px solid var(--line2); border-radius:2px; height:20px; padding:0 2px; max-width:100%; flex:1; min-width:0; }
  .hdr .mix.m2 { margin-top:-2px; }
  .hdr.midi .vol { flex:1; }
  #addTrack, #addMidi { height:calc(var(--lane-h) / 2); width:100%; font-size:0.66rem; letter-spacing:0.16em; text-transform:uppercase; color:rgba(250,248,245,0.5); border-bottom:1px solid var(--line); }
  #addTrack:hover, #addMidi:hover { color:var(--ivory); }
  .clip.midi canvas { top:17px; opacity:1; }
  .clip.midi { background:linear-gradient(rgba(0,0,0,0.12), rgba(0,0,0,0.12)), var(--c, #6b5a4a); }
  .clip.rec { border:1px dashed rgba(250,248,245,0.7); background:rgba(178,74,58,0.4); pointer-events:none; }

  /* ---------- piano roll ---------- */
  #roll { flex:none; height:0; border-top:1px solid var(--line2); background:rgba(14,12,9,0.75); display:grid; grid-template-columns:var(--hdr-w) 1fr; grid-template-rows:30px 1fr; overflow:hidden; transition:height .15s; }
  #roll.open { height:min(300px, 42vh); }
  #rollHead { grid-column:1 / 3; display:flex; align-items:center; gap:0.6rem; padding:0 0.8rem; border-bottom:1px solid var(--line2); font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase; color:rgba(250,248,245,0.55); }
  #rollHead b { color:var(--ivory); font-weight:400; letter-spacing:0.04em; text-transform:none; font-size:0.85rem; }
  #rollHead .tbtn { height:22px; font-size:0.62rem; padding:0 0.5rem; }
  #rollHead .sp { flex:1; }
  #keys { overflow:hidden; border-right:1px solid var(--line2); position:relative; }
  #keysInner { position:absolute; left:0; top:0; width:100%; }
  .key { height:var(--row-h, 12px); border-bottom:1px solid rgba(0,0,0,0.25); font-size:0.58rem; line-height:var(--row-h, 12px); padding-left:6px; color:rgba(0,0,0,0.6); background:#e9e3d9; cursor:pointer; }
  .key.b { background:#3a332b; color:rgba(250,248,245,0.4); }
  .key.c { color:#000; font-weight:500; }
  .key.down { background:var(--terracotta) !important; }
  #rollScroll { overflow:auto; position:relative; overscroll-behavior:none; scrollbar-width:thin; scrollbar-color:var(--clay-dark) transparent; touch-action:pan-x pan-y; }
  #rollGrid { position:relative; }
  #rollCv { position:absolute; left:0; top:0; pointer-events:none; }
  .note { position:absolute; height:calc(var(--row-h, 12px) - 1px); background:var(--terracotta); border-radius:2px; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.4); cursor:grab; touch-action:none; }
  .note.sel { background:var(--ivory); }
  .note .h { position:absolute; right:0; top:0; bottom:0; width:6px; cursor:ew-resize; }
  #rollPh { position:absolute; top:0; width:1px; height:100%; background:var(--ivory); pointer-events:none; opacity:0.8; }
  #vel { width:70px; height:14px; }

  /* ---------- fx rack ---------- */
  #fxPanel { flex:none; height:0; border-top:1px solid var(--line2); background:rgba(14,12,9,0.75); display:flex; flex-direction:column; overflow:hidden; transition:height .15s; }
  #fxPanel.open { height:min(230px, 36vh); }
  #fxHead { flex:none; display:flex; align-items:center; gap:0.6rem; padding:0 0.8rem; height:30px; border-bottom:1px solid var(--line2); font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase; color:rgba(250,248,245,0.55); }
  #fxHead b { color:var(--ivory); font-weight:400; letter-spacing:0.04em; text-transform:none; font-size:0.85rem; }
  #fxHead .sp { flex:1; } #fxHead .tbtn { height:22px; font-size:0.62rem; padding:0 0.5rem; } #fxHead select.tbtn { background:rgba(0,0,0,0.3); }
  #fxList { flex:1; display:flex; gap:0.6rem; padding:0.6rem 0.8rem; overflow-x:auto; overflow-y:hidden; align-items:flex-start; scrollbar-width:thin; scrollbar-color:var(--clay-dark) transparent; touch-action:pan-x; }
  .fxc { flex:none; width:200px; border:1px solid var(--line2); border-radius:4px; background:rgba(0,0,0,0.25); padding:0.35rem 0.5rem 0.45rem; display:flex; flex-direction:column; gap:0.2rem; }
  .fxc.off { opacity:0.45; }
  .fxh { display:flex; align-items:center; gap:0.4rem; margin-bottom:0.15rem; }
  .fxh .fxt { flex:1; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; }
  .fxh .x { opacity:0.4; font-size:1rem; line-height:1; padding:0 3px; } .fxh .x:hover { opacity:1; }
  .ms.p.on { background:var(--terracotta); border-color:var(--terracotta); color:var(--ink); }
  .fxr { display:grid; grid-template-columns:52px 1fr 44px; align-items:center; gap:0.3rem; font-size:0.62rem; }
  .fxr .l { color:rgba(250,248,245,0.55); letter-spacing:0.06em; } .fxr .v { text-align:right; color:rgba(250,248,245,0.7); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .fxr input[type=range] { height:12px; min-width:0; width:100%; } .fxr select { font:inherit; font-size:0.62rem; color:var(--ivory); background:rgba(0,0,0,0.35); border:1px solid var(--line2); border-radius:2px; height:18px; }
  .fx-empty { align-self:center; font-size:0.72rem; color:rgba(250,248,245,0.4); letter-spacing:0.08em; }
  .ms.fx.on { background:var(--terracotta); color:var(--ink); border-color:var(--terracotta); }

  @media (max-width:760px) {
    :root { --hdr-w:124px; --lane-h:64px; }
    nav { padding:0.6rem 1rem 0.4rem; }
    #transport { padding:0.4rem 0.8rem; gap:0.4rem; }
    #pos { font-size:1.2rem; min-width:5.4rem; }
    #hint { display:none; }
    .hdr .pan { display:none; }
    .field.snapf { display:none; }
    #tray { max-height:100px; }
    #roll.open { height:40vh; }
    .nav-content { flex-direction:column; align-items:flex-start; gap:0.4rem; }
    .logo { font-size:0.95rem; }
    .nav-links { gap:0.7rem 0.9rem; justify-content:flex-start; }
    .nav-links a { font-size:0.6rem; letter-spacing:0.12em; }
    #trayHead { padding:0.45rem 0.4rem; }
    #trayHead .tbtn { font-size:0.6rem; padding:0 0.3rem; letter-spacing:0.04em; }
  }
</style>
</head>

<div id="transport">
  <div class="tgroup">
    <button class="tbtn" id="btnHome" title="Return to start (Home)"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM13 2 6 8l7 6z"/></svg></button>
    <button class="tbtn" id="btnPlay" title="Play / Stop (Space)"><svg viewBox="0 0 16 16"><path id="playIcon" d="M4 2l10 6-10 6z"/></svg></button>
    <button class="tbtn" id="btnStop" title="Stop"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10"/></svg></button>
    <button class="tbtn" id="btnRec" title="Record onto the selected track (R)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/></svg></button>
  </div>
  <div id="pos">1.1.1</div>
  <div class="tsep"></div>
  <label class="field">bpm <input type="number" id="bpm" min="20" max="300" step="0.5" value="120"></label>
  <button class="tbtn" id="btnLoop" title="Loop (L)">loop</button>
  <button class="tbtn" id="btnClick" title="Metronome (K)">click</button>
  <button class="tbtn" id="btnMidi" title="Connect MIDI keyboards (Web MIDI)">midi</button>
  <button class="tbtn" id="btnKbd" title="Play the selected instrument from the computer keyboard (⇧K)">keys</button>
  <label class="field snapf">snap <select id="snap"><option value="4">bar</option><option value="1">beat</option><option value="0.5">1/8</option><option value="0.25" selected>1/16</option><option value="0">off</option></select></label>
  <div class="tsep"></div>
  <div class="tgroup">
    <button class="tbtn" id="btnUndo" title="Undo (⌘Z)">undo</button>
    <button class="tbtn" id="btnRedo" title="Redo (⇧⌘Z)">redo</button>
    <button class="tbtn" id="btnSplit" title="Split at playhead (S)">split</button>
    <button class="tbtn" id="btnDel" title="Delete (⌫)">del</button>
  </div>
  <div class="tsep"></div>
  <div class="tgroup">
    <button class="tbtn" id="btnZoomOut" title="Zoom out (−)">−</button>
    <button class="tbtn" id="btnZoomIn" title="Zoom in (+)">+</button>
    <button class="tbtn" id="btnExport" title="Render the arrangement to a WAV file">export</button>
  </div>
  <div id="spacer"></div>
  <div id="hint">dbl-click a midi clip to edit · ● records the selected track · keys: A–L play, Z/X octave</div>
</div>

<div id="arr">
  <div id="corner">arrangement</div>
