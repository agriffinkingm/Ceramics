<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>daw — alexander griffin king miller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory:#FAF8F5; --clay:#E8DDD3; --clay-dark:#8B7968; --terracotta:#C67B5C;
    --stone:#4A4238; --charcoal:#2C2820; --ink:#1C1812;
    --line:rgba(250,248,245,0.08); --line2:rgba(250,248,245,0.16);
    --hdr-w:188px; --lane-h:76px; --ruler-h:34px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Karla', system-ui, sans-serif; background:var(--charcoal); color:var(--ivory);
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none;
    display:flex; flex-direction:column;
  }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  input[type=range] { accent-color:var(--terracotta); }

  /* ---------- nav ---------- */
  nav { padding:0.9rem 1.6rem 0.6rem; flex:none; }
  .nav-content { display:flex; justify-content:space-between; align-items:center; gap:1rem; }
  .logo { font-family:'Cormorant Garamond', serif; font-size:1.1rem; letter-spacing:0.06em; color:var(--ivory); text-decoration:none; white-space:nowrap; }
  .nav-links { display:flex; gap:1.4rem; list-style:none; flex-wrap:wrap; justify-content:flex-end; }
  .nav-links a { color:rgba(250,248,245,0.75); text-decoration:none; font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; padding-bottom:3px; border-bottom:1px solid transparent; }
  .nav-links a:hover, .nav-links a.active { color:var(--ivory); border-color:var(--terracotta); }

  /* ---------- transport ---------- */
  #transport {
    flex:none; display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;
    padding:0.5rem 1.6rem; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    background:rgba(20,17,12,0.5);
  }
  .tbtn {
    height:34px; min-width:34px; padding:0 0.7rem; border:1px solid var(--line2); border-radius:3px;
    font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; color:rgba(250,248,245,0.85);
    display:inline-flex; align-items:center; justify-content:center; gap:0.35rem;
  }
  .tbtn:hover { border-color:var(--terracotta); }
  .tbtn.on { background:var(--terracotta); border-color:var(--terracotta); color:var(--ink); }
  .tbtn.danger.on { background:#b24a3a; border-color:#b24a3a; color:var(--ivory); }
  .tbtn svg { width:14px; height:14px; fill:currentColor; }
  .tgroup { display:flex; align-items:center; gap:0.35rem; }
  .tsep { width:1px; height:24px; background:var(--line2); margin:0 0.3rem; }
  #pos { font-family:'Cormorant Garamond', serif; font-size:1.5rem; font-variant-numeric:tabular-nums; min-width:7.2rem; letter-spacing:0.04em; line-height:1; padding:0 0.3rem; }
  .field { display:flex; align-items:center; gap:0.3rem; font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase; color:rgba(250,248,245,0.55); }
  .field input, .field select {
    font:inherit; color:var(--ivory); background:rgba(0,0,0,0.3); border:1px solid var(--line2); border-radius:3px;
    height:34px; padding:0 0.4rem; font-size:0.9rem; letter-spacing:0; text-transform:none;
  }
  .field input[type=number] { width:4.3rem; text-align:center; }
  .field select { appearance:none; padding-right:0.4rem; }
  #spacer { flex:1; }
  #hint { font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; color:rgba(250,248,245,0.4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:38vw; }

  /* ---------- arrangement ---------- */
  #arr { flex:1; min-height:0; display:grid; grid-template-columns:var(--hdr-w) 1fr; grid-template-rows:var(--ruler-h) 1fr; position:relative; }
  #corner { border-right:1px solid var(--line2); border-bottom:1px solid var(--line2); background:rgba(20,17,12,0.5); display:flex; align-items:center; padding:0 0.7rem; font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:rgba(250,248,245,0.45); }
  #rulerWrap { position:relative; overflow:hidden; border-bottom:1px solid var(--line2); background:rgba(20,17,12,0.5); cursor:text; }
  #ruler { position:absolute; left:0; top:0; height:100%; }
  #ruler canvas { position:absolute; left:0; top:0; height:100%; }
  #loopBar { position:absolute; top:0; height:9px; background:rgba(198,123,92,0.35); border-left:2px solid var(--terracotta); border-right:2px solid var(--terracotta); display:none; pointer-events:none; }
  #loopBar.on { background:var(--terracotta); }
  #hdrs { overflow:hidden; border-right:1px solid var(--line2); background:rgba(20,17,12,0.3); position:relative; }
  #hdrsInner { position:absolute; left:0; top:0; width:100%; }
  #lanesWrap { position:relative; overflow:auto; touch-action:pan-x pan-y; overscroll-behavior:none; background:var(--charcoal); scrollbar-width:thin; scrollbar-color:var(--clay-dark) transparent; }
  #lanes { position:relative; min-width:100%; }
  #grid { position:absolute; left:0; top:0; pointer-events:none; }
  .lane { position:relative; height:var(--lane-h); border-bottom:1px solid var(--line); }
  .lane.over { background:rgba(198,123,92,0.08); }
  .hdr { height:var(--lane-h); border-bottom:1px solid var(--line); padding:0.45rem 0.6rem 0.4rem 0.7rem; display:flex; flex-direction:column; gap:0.3rem; position:relative; }
  .hdr.sel { background:rgba(250,248,245,0.05); }
  .hdr .top { display:flex; align-items:center; gap:0.4rem; }
  .hdr .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .hdr .name { flex:1; font-size:0.8rem; letter-spacing:0.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; outline:0; padding:1px 2px; border-radius:2px; min-width:0; }
  .hdr .name:focus { background:rgba(0,0,0,0.35); }
  .hdr .x { opacity:0.35; font-size:0.9rem; line-height:1; padding:0 2px; }
  .hdr .x:hover { opacity:1; color:#e07a5f; }
  .hdr .mix { display:flex; align-items:center; gap:0.35rem; }
  .ms { width:22px; height:20px; font-size:0.64rem; border:1px solid var(--line2); border-radius:2px; color:rgba(250,248,245,0.6); }
  .ms.on.m { background:#8a6a3a; color:var(--ivory); border-color:#8a6a3a; }
  .ms.on.s { background:#4f7a8a; color:var(--ivory); border-color:#4f7a8a; }
  .hdr input[type=range] { height:14px; min-width:0; }
  .hdr .vol { flex:1; }
  .hdr .pan { width:46px; }
  .hdr .meter { position:absolute; right:0; top:0; bottom:0; width:3px; background:rgba(0,0,0,0.4); }
  .hdr .meter i { position:absolute; left:0; right:0; bottom:0; height:0; background:var(--terracotta); }
  #addTrack { height:var(--lane-h); width:100%; font-size:0.7rem; letter-spacing:0.16em; text-transform:uppercase; color:rgba(250,248,245,0.5); border-bottom:1px solid var(--line); }
  #addTrack:hover { color:var(--ivory); }
  .lane.empty { opacity:0; }

  .clip {
    position:absolute; top:4px; height:calc(var(--lane-h) - 9px); border-radius:4px; overflow:hidden;
    background:var(--c, #6b5a4a); box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35); cursor:grab; touch-action:none;
  }
  .clip.sel { box-shadow:inset 0 0 0 2px var(--ivory), 0 0 0 1px rgba(0,0,0,0.4); }
  .clip canvas { position:absolute; left:0; top:17px; height:calc(100% - 17px); width:100%; opacity:0.85; pointer-events:none; }
  .clip .lbl { position:absolute; left:0; right:0; top:0; height:17px; line-height:17px; padding:0 6px; font-size:0.66rem; letter-spacing:0.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:rgba(0,0,0,0.28); color:var(--ivory); pointer-events:none; }
  .clip .h { position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize; }
  .clip .h.l { left:0; } .clip .h.r { right:0; }
  .clip .h:hover { background:rgba(250,248,245,0.18); }
  .clip.muted { opacity:0.45; }
  #playhead { position:absolute; top:0; width:1px; height:100%; background:var(--ivory); pointer-events:none; z-index:5; box-shadow:0 0 6px rgba(250,248,245,0.6); }
  #rph { position:absolute; top:0; width:1px; height:100%; background:var(--ivory); pointer-events:none; }
  #rph::before { content:''; position:absolute; left:-5px; bottom:0; border:5px solid transparent; border-bottom-color:var(--ivory); }
  #ghost { position:absolute; top:4px; height:calc(var(--lane-h) - 9px); border:1px dashed var(--ivory); border-radius:4px; pointer-events:none; display:none; z-index:6; }

  /* ---------- browser / tray ---------- */

  #banner { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:rgba(20,17,12,0.92); border:1px solid var(--line2); padding:0.5rem 0.9rem; font-size:0.78rem; letter-spacing:0.04em; border-radius:4px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; max-width:80vw; text-align:center; }
  #banner.show { opacity:1; }
  body.dropping::after { content:'drop audio to add it'; position:fixed; inset:0; background:rgba(198,123,92,0.18); border:3px dashed var(--terracotta); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond', serif; font-size:2.2rem; pointer-events:none; z-index:60; }

  /* ---------- record / midi ---------- */
  #btnRec.on { background:#b24a3a; border-color:#b24a3a; color:var(--ivory); }
  #btnRec.live { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { background:#e0604a; border-color:#e0604a; } }
  .hdr .kind { font-size:0.56rem; letter-spacing:0.12em; text-transform:uppercase; color:rgba(250,248,245,0.45); padding:1px 4px; border:1px solid var(--line2); border-radius:2px; flex:none; }
  .hdr select.inst { font:inherit; font-size:0.66rem; color:var(--ivory); background:rgba(0,0,0,0.35); border:1px solid var(--line2); border-radius:2px; height:20px; padding:0 2px; max-width:100%; flex:1; min-width:0; }
  .hdr .mix.m2 { margin-top:-2px; }
  .hdr.midi .vol { flex:1; }
  #addTrack, #addMidi, #addSampler { height:calc(var(--lane-h) / 3); width:100%; font-size:0.66rem; letter-spacing:0.16em; text-transform:uppercase; color:rgba(250,248,245,0.5); border-bottom:1px solid var(--line); }
  #addTrack:hover, #addMidi:hover, #addSampler:hover { color:var(--ivory); }
  .clip.midi canvas { top:17px; opacity:1; }
  .clip.midi { background:linear-gradient(rgba(0,0,0,0.12), rgba(0,0,0,0.12)), var(--c, #6b5a4a); }
  .clip.rec { border:1px dashed rgba(250,248,245,0.7); background:rgba(178,74,58,0.4); pointer-events:none; }

  /* ---------- piano roll ---------- */
  #roll { flex:none; height:0; border-top:1px solid var(--line2); background:rgba(14,12,9,0.75); display:grid; grid-template-columns:var(--hdr-w) 1fr; grid-template-rows:30px 16px 1fr; overflow:hidden; transition:height .15s; }
  #rollCorner { border-right:1px solid var(--line2); border-bottom:1px solid var(--line2); font-size:0.56rem; letter-spacing:0.14em; text-transform:uppercase; color:rgba(250,248,245,0.4); padding:0 0.7rem; line-height:16px; }
  #rollRulerWrap { position:relative; overflow:hidden; border-bottom:1px solid var(--line2); cursor:ew-resize; }
  #rollRuler { position:absolute; left:0; top:0; height:16px; }
  #rollRuler canvas { position:absolute; left:0; top:0; height:16px; }
  #roll.open { height:min(300px, 42vh); }
  #rollHead { grid-column:1 / 3; display:flex; align-items:center; gap:0.6rem; padding:0 0.8rem; border-bottom:1px solid var(--line2); font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase; color:rgba(250,248,245,0.55); }
  #rollHead b { color:var(--ivory); font-weight:400; letter-spacing:0.04em; text-transform:none; font-size:0.85rem; }
  #rollHead .tbtn { height:22px; font-size:0.62rem; padding:0 0.5rem; }
  #rollHead .sp { flex:1; }
  #keys { overflow:hidden; border-right:1px solid var(--line2); position:relative; }
  #keysInner { position:absolute; left:0; top:0; width:100%; }
  .key { height:var(--row-h, 12px); border-bottom:1px solid rgba(0,0,0,0.25); font-size:0.58rem; line-height:var(--row-h, 12px); padding-left:6px; color:rgba(0,0,0,0.6); background:#e9e3d9; cursor:pointer; }
  .key.b { background:#3a332b; color:rgba(250,248,245,0.4); }
  .key.c { color:#000; font-weight:500; }
  .key.down { background:var(--terracotta) !important; }
  #rollScroll { overflow:auto; position:relative; overscroll-behavior:none; scrollbar-width:thin; scrollbar-color:var(--clay-dark) transparent; touch-action:pan-x pan-y; }
  #rollGrid { position:relative; }
  #rollCv { position:absolute; left:0; top:0; pointer-events:none; }
  .note { position:absolute; height:calc(var(--row-h, 12px) - 1px); background:var(--terracotta); border-radius:2px; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.4); cursor:grab; touch-action:none; }
  .note.sel { background:var(--ivory); }
  .note .h { position:absolute; right:0; top:0; bottom:0; width:6px; cursor:ew-resize; }
  #rollLoopBar { position:absolute; top:0; left:0; height:16px; background:rgba(198,123,92,0.35); border-right:2px solid var(--terracotta); display:none; }
  #rollLoopBar.on { display:block; }
  #rollLoopEnd { position:absolute; right:-9px; top:0; width:18px; height:16px; cursor:ew-resize; }
  #rollLoopEnd::after { content:''; position:absolute; left:4px; top:3px; border:5px solid transparent; border-top:8px solid var(--terracotta); }
  #rollLoop.on { background:var(--terracotta); border-color:var(--terracotta); color:var(--ink); }
  #marquee { position:absolute; display:none; border:1px solid var(--ivory); background:rgba(250,248,245,0.12); pointer-events:none; z-index:3; }
  #rollPh { position:absolute; top:0; width:1px; height:100%; background:var(--ivory); pointer-events:none; opacity:0.8; }
  #vel { width:70px; height:14px; }
  .qbox { display:inline-flex; align-items:center; gap:0.5rem; padding:0 0.5rem; border-left:1px solid var(--line2); border-right:1px solid var(--line2); }
  .qbox .field { font-size:0.62rem; }
  .qbox select { height:22px; font-size:0.7rem; padding:0 0.2rem; }
  .qbox input[type=range] { width:60px; height:12px; }
  .qbox #qStrV { min-width:2.4em; color:rgba(250,248,245,0.75); letter-spacing:0; }
  .field.chk { gap:0.2rem; cursor:pointer; } .field.chk input { accent-color:var(--terracotta); }
  @media (max-width:980px) { .qbox .field.chk, .qbox #qStrV { display:none; } }


  /* ---------- fx rack ---------- */
  #fxPanel { flex:none; height:0; border-top:1px solid var(--line2); background:rgba(14,12,9,0.75); display:flex; flex-direction:column; overflow:hidden; transition:height .15s; }
  #fxPanel.open { height:min(230px, 36vh); }
  #fxPanel:not(.open), #padPanel:not(.open), #roll:not(.open) { pointer-events:none; border-top:0; }
  #fxHead { flex:none; display:flex; align-items:center; gap:0.6rem; padding:0 0.8rem; height:30px; border-bottom:1px solid var(--line2); font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase; color:rgba(250,248,245,0.55); }
  #fxHead b { color:var(--ivory); font-weight:400; letter-spacing:0.04em; text-transform:none; font-size:0.85rem; }
  #fxHead .sp { flex:1; } #fxHead .tbtn { height:22px; font-size:0.62rem; padding:0 0.5rem; } #fxHead select.tbtn { background:rgba(0,0,0,0.3); }
  #fxList { flex:1; display:flex; gap:0.6rem; padding:0.6rem 0.8rem; overflow-x:auto; overflow-y:hidden; align-items:flex-start; scrollbar-width:thin; scrollbar-color:var(--clay-dark) transparent; touch-action:pan-x; }
  .fxc { flex:none; width:200px; border:1px solid var(--line2); border-radius:4px; background:rgba(0,0,0,0.25); padding:0.35rem 0.5rem 0.45rem; display:flex; flex-direction:column; gap:0.2rem; }
  .fxc.off { opacity:0.45; }
  .fxh { display:flex; align-items:center; gap:0.4rem; margin-bottom:0.15rem; }
  .fxh .fxt { flex:1; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; }
  .fxh .x { opacity:0.4; font-size:1rem; line-height:1; padding:0 3px; } .fxh .x:hover { opacity:1; }
  .ms.p.on { background:var(--terracotta); border-color:var(--terracotta); color:var(--ink); }
  .fxr { display:grid; grid-template-columns:52px 1fr 44px; align-items:center; gap:0.3rem; font-size:0.62rem; }
  .fxr .l { color:rgba(250,248,245,0.55); letter-spacing:0.06em; } .fxr .v { text-align:right; color:rgba(250,248,245,0.7); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .fxr input[type=range] { height:12px; min-width:0; width:100%; } .fxr select { font:inherit; font-size:0.62rem; color:var(--ivory); background:rgba(0,0,0,0.35); border:1px solid var(--line2); border-radius:2px; height:18px; }
  .fx-empty { align-self:center; font-size:0.72rem; color:rgba(250,248,245,0.4); letter-spacing:0.08em; }
  .ms.fx.on, .ms.pads.on { background:var(--terracotta); color:var(--ink); border-color:var(--terracotta); }
  .ms.pads { width:auto; padding:0 5px; font-size:0.58rem; letter-spacing:0.08em; }

  /* ---------- session / sharing / inspector ---------- */
  .tbtn.sm { height:26px; font-size:0.62rem; padding:0 0.45rem; }
  #recOpts .tbtn.on, #btnCountIn.on, #btnOverdub.on { background:var(--terracotta); border-color:var(--terracotta); color:var(--ink); }
  #masterStrip { gap:0.4rem; } #masterStrip input { width:80px; height:14px; }
  #btnShare.on { background:#4f7a8a; border-color:#4f7a8a; color:var(--ivory); }
  .vbtn { font-size:0.62rem; letter-spacing:0.16em; text-transform:uppercase; color:rgba(250,248,245,0.4); padding:0 0.4rem; height:100%; }
  .vbtn.on { color:var(--ivory); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--terracotta); }
  #corner { padding:0 0.2rem; gap:0.1rem; }
  #session { display:none; flex:1; min-height:0; flex-direction:column; }
  body.sessview #arr { display:none; } body.sessview #session { display:flex; }
  #sessHead { flex:none; display:flex; align-items:center; gap:0.6rem; padding:0 0.8rem; height:32px; border-bottom:1px solid var(--line2); font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase; color:rgba(250,248,245,0.55); background:rgba(20,17,12,0.5); }
  #sessHead .sp { flex:1; } #sessHead select { height:24px; font-size:0.75rem; }
  #sessScroll { flex:1; overflow:auto; padding:0.6rem; scrollbar-width:thin; scrollbar-color:var(--clay-dark) transparent; }
  #sessGrid { display:grid; gap:4px; align-content:start; }
  .sh { height:34px; display:flex; align-items:center; gap:0.35rem; padding:0 0.5rem; font-size:0.74rem; border-bottom:1px solid var(--line2); white-space:nowrap; overflow:hidden; }
  .sh .n { flex:1; overflow:hidden; text-overflow:ellipsis; } .sh .dot { width:8px; height:8px; border-radius:50%; flex:none; } .sh .kind { font-size:0.52rem; letter-spacing:0.12em; text-transform:uppercase; color:rgba(250,248,245,0.4); border:1px solid var(--line2); padding:0 3px; border-radius:2px; }
  .sh.corner { border:0; }
  .scene { height:38px; border:1px solid var(--line2); border-radius:3px; font-size:0.8rem; color:rgba(250,248,245,0.6); } .scene:hover { border-color:var(--terracotta); color:var(--ivory); }
  .stopc { height:30px; border:1px solid var(--line2); border-radius:3px; font-size:0.7rem; color:rgba(250,248,245,0.5); } .stopc:hover { color:var(--ivory); border-color:var(--terracotta); }
  .slot { position:relative; height:38px; border:1px dashed var(--line2); border-radius:3px; display:flex; align-items:center; gap:0.35rem; padding:0 0.35rem; font-size:0.72rem; cursor:pointer; overflow:hidden; user-select:none; }
  .slot.sel { outline:1px solid var(--ivory); }
  .slot.over { background:rgba(250,248,245,0.05); }
  .slot .stop { opacity:0; font-size:0.7rem; color:rgba(250,248,245,0.6); } .slot:hover .stop { opacity:1; }
  .slot.filled { border:1px solid rgba(0,0,0,0.4); background:var(--c, #6b5a4a); color:var(--ivory); }
  .slot.filled .n { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:relative; }
  .slot .go { width:22px; height:22px; border-radius:2px; background:rgba(0,0,0,0.3); font-size:0.7rem; flex:none; position:relative; } .slot .go:hover { background:rgba(0,0,0,0.5); }
  .slot.playing { box-shadow:inset 0 0 0 2px #7fb77a; } .slot.playing .go { background:#7fb77a; color:var(--ink); }

<script type="module">
const BUILD = "2026-10-03h";
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const COLORS = ["#8a5a44", "#5a7a6a", "#7a6a8a", "#8a7a3a", "#4f7a8a", "#8a4f6a", "#6a7a4a", "#8a6a4f"];

// ---------- project state (everything the ops touch) ----------
// This is the shape that will be shared through Firebase later: tracks + clips keyed by id,
// edits expressed as ops (commit()), replayable in any order per entity.
const proj = { bpm: 120, loop: { on: false, a: 0, b: 16 }, tracks: {}, clips: {}, scenes: 8, master: { gain: 0.9, fx: [] } };
const audios = {};             // id -> { name, buf, peaks, dur }  (not shared; local decode cache)
let selected = new Set();      // clip ids
let selTrack = null;
let pxPerBeat = 28;            // zoom
let snapBeats = 0.25;
let playhead = 0;              // beats, when stopped
let undoStack = [], redoStack = [];

const tracksSorted = () => Object.values(proj.tracks).sort((a, b) => a.order - b.order);
const clipsOf = tid => Object.values(proj.clips).filter(c => c.track === tid);
const spb = () => 60 / proj.bpm;                     // seconds per beat
const clipEnd = c => c.start + c.len;
const projEndBeat = () => Math.max(16, ...Object.values(proj.clips).map(clipEnd)) ;

// ---------- ops ----------
// op = { t:"track"|"clip", id, ...fields } merge; { t, id, del:true } delete; { t:"set", k, v } project field.
function applyOp(op) {
  if (op.t === "set") { setPath(proj, op.k, op.v); return; }
  const col = op.t === "track" ? proj.tracks : proj.clips;
  if (op.del) { delete col[op.id]; if (op.t === "track") for (const c of clipsOf(op.id)) delete proj.clips[c.id]; selected.delete(op.id); return; }
  const cur = col[op.id] || (col[op.id] = { id: op.id });
  for (const k in op) if (k !== "t" && k !== "id" && k !== "del") cur[k] = op[k];
}
function setPath(o, k, v) { const p = k.split("."); for (let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = v; }
function getPath(o, k) { for (const s of k.split(".")) o = o[s]; return o; }
function inverseOf(op) {
  if (op.t === "set") { const v = getPath(proj, op.k); return { t: "set", k: op.k, v: v && typeof v === "object" ? JSON.parse(JSON.stringify(v)) : v }; }
  const col = op.t === "track" ? proj.tracks : proj.clips;
  const cur = col[op.id];
  if (op.del) {
    const inv = [{ t: op.t, id: op.id, ...cur }];
    if (op.t === "track") for (const c of clipsOf(op.id)) inv.push({ t: "clip", id: c.id, ...c });
    return inv;
  }
  if (!cur) return { t: op.t, id: op.id, del: true };
  const inv = { t: op.t, id: op.id };
  for (const k in op) if (k !== "t" && k !== "id") inv[k] = cur[k];
  return inv;
}
function commit(ops, { undoable = true } = {}) {
  ops = [].concat(ops);
  const inv = ops.map(inverseOf).flat().reverse();
  for (const op of ops) applyOp(op);
  if (undoable) { undoStack.push({ ops, inv }); redoStack.length = 0; if (undoStack.length > 200) undoStack.shift(); }
  afterChange(ops); netSend(ops);
}
function undo() { const e = undoStack.pop(); if (!e) return; for (const op of e.inv) applyOp(op); redoStack.push(e); afterChange(e.inv); netSend(e.inv); banner("undo"); }
function redo() { const e = redoStack.pop(); if (!e) return; for (const op of e.ops) applyOp(op); undoStack.push(e); afterChange(e.ops); netSend(e.ops); banner("redo"); }
function afterChange(ops) {
  for (const id of [...selected]) if (!proj.clips[id]) selected.delete(id);
  if (ops.some(o => o.t === "set" && o.k === "bpm")) $("#bpm").value = proj.bpm;
  render(); if (rollClip) renderRoll(); if (fxTrack) renderFx(); if (padTrack) renderPads(); renderSession(); renderInsp();
  if (ops.some(o => o.t === "set" && o.k === "master")) { engine.refreshMaster(); $("#masterGain").value = proj.master.gain; }
  if (ops.some(o => o.t === "clip" && (o.del || "scene" in o))) for (const tid in sess) if (!proj.clips[sess[tid].clip]) delete sess[tid];
  if (ops.some(o => o.t === "track" && "fx" in o)) engine.refreshFx(o => ops.some(p => p.id === o));
  if (ops.some(o => o.t === "set" && o.k === "bpm")) { engine.refreshFx(); engine.refreshMaster(); }
  if (ops.some(o => o.t === "set" && o.k === "scenes")) renderSession();
  if (ops.some(o => o.t === "clip" || (o.t === "track" && o.del) || (o.t === "set" && (o.k === "bpm" || o.k.startsWith("loop"))))) engine.reschedule();
  engine.refreshMix();
  saveSoon();
}

// ---------- instruments ----------
// An instrument is { play(ctx, dest, pitch, vel, t0) -> voice{stop(t), kill()} }. Buffers are context-free, so the
// same code renders live and offline (export).
const mtof = p => 440 * Math.pow(2, (p - 69) / 12);
const SYNTHS = {
  keys:  { o: [["triangle", 0, 1], ["sine", 12, 0.35]], f: [2600, 1200], a: 0.005, d: 0.5, s: 0.35, r: 0.35, g: 0.5 },
  pad:   { o: [["sawtooth", -0.08, 0.5], ["sawtooth", 0.08, 0.5]], f: [900, 2200], a: 0.5, d: 0.6, s: 0.8, r: 0.9, g: 0.35 },
  bass:  { o: [["sawtooth", 0, 0.7], ["square", -12, 0.5]], f: [320, 1900], a: 0.004, d: 0.18, s: 0.45, r: 0.12, g: 0.6, mono: true },

// ---------- count-in + overdub ----------

function playCountIn(done) {

  for (let i = 0; i < 4; i++) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = i === 0 ? 1600 : 1100; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.3, t + i * spb()); g.gain.exponentialRampToValueAtTime(0.001, t + i * spb() + 0.05); o.start(t + i * spb()); o.stop(t + i * spb() + 0.06); }

// ---------- scale highlight ----------

  const blob = new Blob([JSON.stringify(out)], { type: "application/json" }), a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (room ? "room-" + room : "project") + ".agkm.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);

$("#btnOpenProj").onclick = () => $("#projIn").click();
$("#projIn").addEventListener("change", async e => {

    for (const id in o.audio || {}) if (!audios[id]) await addAudio(o.audio[id].name + ".wav", await (await fetch(o.audio[id].data)).blob(), { id });
    const ops = [{ t: "set", k: "bpm", v: o.bpm || 120 }, { t: "set", k: "loop", v: o.loop || { on: false, a: 0, b: 16 } }, { t: "set", k: "scenes", v: o.scenes || 8 }, { t: "set", k: "master", v: o.master || { gain: 0.9, fx: [] } }];

// ---------- sampler pads panel ----------
let padTrack = null, padSel = null;
const padEl = $("#padPanel"), padGrid = $("#padGrid");
function openPads(tid) { if (padTrack === tid && padEl.classList.contains("open")) return closePads(); closeFx(); closeRoll(); padTrack = tid; padSel = padSel ?? PAD0; padEl.classList.add("open"); renderPads(); render(); }
function closePads() { padTrack = null; padEl.classList.remove("open"); render(); }
$("#padClose").onclick = closePads;
function padsOf(tid) { return proj.tracks[tid]?.pads || {}; }
function setPad(tid, pitch, v) { const pads = { ...padsOf(tid) }; if (v) pads[pitch] = v; else delete pads[pitch]; commit({ t: "track", id: tid, pads }); }

function renderPads() {

  $("#padName").textContent = t.name;

  padGrid.innerHTML = "";

    d.innerHTML = `<div class="k"><span>${noteName(p)}</span><span class="dur">${pd ? (a ? a.dur.toFixed(2) + "s" : "…") : ""}</span></div>` + (pd ? `<div class="n"></div><canvas width="100" height="22"></canvas><button class="x" title="clear pad">×</button>` : `<div class="empty">drop audio<br>or + files</div>`);
    if (pd) { d.querySelector(".n").textContent = a ? a.name : "(missing)"; if (a) drawPeaks(d.querySelector("canvas"), a.peaks); d.querySelector(".x").onclick = e => { e.stopPropagation(); setPad(padTrack, p, null); }; }

    d.addEventListener("drop", async e => { e.preventDefault(); e.stopPropagation(); d.classList.remove("over"); document.body.classList.remove("dropping"); dropDepth = 0; const fs = [...e.dataTransfer.files]; let q = p; for (const f of fs) { const id = await addAudio(f.name, f); if (id) setPad(padTrack, q++, { src: id, gain: 1 }); } });
    padGrid.appendChild(d);
  }
}
function drawPeaks(cv, peaks) { const g = cv.getContext("2d"); g.fillStyle = "#C67B5C"; for (let x = 0; x < cv.width; x++) { const i0 = Math.floor(x / cv.width * peaks.length), i1 = Math.floor((x + 1) / cv.width * peaks.length); let m = 0; for (let i = i0; i <= i1 && i < peaks.length; i++) if (peaks[i] > m) m = peaks[i]; const hh = Math.max(1, m * cv.height); g.fillRect(x, (cv.height - hh) / 2, 1, hh); } }
// dragging a pad out drops its sample on an audio lane / session slot (reuses the old tray drag)
function startPadDrag(e, aid) { const x0 = e.clientX, y0 = e.clientY; const chk = ev => { if (Math.hypot(ev.clientX - x0, ev.clientY - y0) > 10) { window.removeEventListener("pointermove", chk); onSampleDown(ev, aid, true); } }; window.addEventListener("pointermove", chk); window.addEventListener("pointerup", () => window.removeEventListener("pointermove", chk), { once: true }); }
$("#padAdd").onclick = () => $("#padIn").click();
$("#padIn").addEventListener("change", async e => { const fs = [...e.target.files]; e.target.value = ""; if (!padTrack) return; let p = freePad(padTrack); for (const f of fs) { const id = await addAudio(f.name, f); if (id) { setPad(padTrack, p, { src: id, gain: 1 }); p = freePad(padTrack); } } });
$("#padKit").onclick = () => { if (!padTrack) return; const pads = { ...padsOf(padTrack) }; let p = freePad(padTrack); for (const id of ["kit-kick", "kit-snare", "kit-hat", "kit-clap", "kit-bass"]) { if (Object.values(pads).some(v => v.src === id)) continue; while (pads[p]) p++; pads[p] = { src: id, gain: 1 }; } commit({ t: "track", id: padTrack, pads }); };

// record the mic straight into a pad (4 beats)
