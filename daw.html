<style>
  :root {
    --ivory:#FAF8F5; --clay:#E8DDD3; --clay-dark:#8B7968; --terracotta:#C67B5C;

  /* ---------- transport ---------- */

  }

    font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; color:rgba(250,248,245,0.85);

  }
  .tbtn:hover { border-color:var(--terracotta); }
  .tbtn.on { background:var(--terracotta); border-color:var(--terracotta); color:var(--ink); }
  .tbtn.danger.on { background:#b24a3a; border-color:#b24a3a; color:var(--ivory); }

  .tgroup { display:flex; align-items:center; gap:0.35rem; }
  .tsep { width:1px; height:24px; background:var(--line2); margin:0 0.3rem; }
  #pos { font-family:'Cormorant Garamond', serif; font-size:1.5rem; font-variant-numeric:tabular-nums; min-width:7.2rem; letter-spacing:0.04em; line-height:1; padding:0 0.3rem; }
  .field { display:flex; align-items:center; gap:0.3rem; font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase; color:rgba(250,248,245,0.55); }
  .field input, .field select {
    font:inherit; color:var(--ivory); background:rgba(0,0,0,0.3); border:1px solid var(--line2); border-radius:3px;
    height:34px; padding:0 0.4rem; font-size:0.9rem; letter-spacing:0; text-transform:none;
  }
  .field input[type=number] { width:4.3rem; text-align:center; }
  .field select { appearance:none; padding-right:0.4rem; }
  #spacer { flex:1; }
  #hint { font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; color:rgba(250,248,245,0.4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:38vw; }

  /* ---------- arrangement ---------- */
  #arr { flex:1; min-height:0; display:grid; grid-template-columns:var(--hdr-w) 1fr; grid-template-rows:var(--ruler-h) 1fr; position:relative; }
  #corner { border-right:1px solid var(--line2); border-bottom:1px solid var(--line2); background:rgba(20,17,12,0.5); display:flex; align-items:center; padding:0 0.7rem; font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:rgba(250,248,245,0.45); }
  #rulerWrap { position:relative; overflow:hidden; border-bottom:1px solid var(--line2); background:rgba(20,17,12,0.5); cursor:text; }

  #loopBar { position:absolute; top:0; height:9px; background:rgba(198,123,92,0.35); border-left:2px solid var(--terracotta); border-right:2px solid var(--terracotta); display:none; pointer-events:none; }
  #loopBar.on { background:var(--terracotta); }
  #hdrs { overflow:hidden; border-right:1px solid var(--line2); background:rgba(20,17,12,0.3); position:relative; }

  .hdr { height:var(--lane-h); border-bottom:1px solid var(--line); padding:0.45rem 0.6rem 0.4rem 0.7rem; display:flex; flex-direction:column; gap:0.3rem; position:relative; }

  .hdr .name:focus { background:rgba(0,0,0,0.35); }

  #tray { flex:none; border-top:1px solid var(--line2); background:rgba(20,17,12,0.55); display:flex; align-items:stretch; max-height:124px; }
  #trayHead { flex:none; width:var(--hdr-w); padding:0.55rem 0.7rem; border-right:1px solid var(--line2); display:flex; flex-direction:column; gap:0.35rem; }

  .smp { flex:none; width:118px; height:88px; border:1px solid var(--line2); border-radius:4px; padding:0.4rem 0.5rem; display:flex; flex-direction:column; gap:0.2rem; cursor:grab; background:rgba(0,0,0,0.25); touch-action:none; position:relative; }

  .smp .d { font-size:0.62rem; color:rgba(250,248,245,0.45); letter-spacing:0.06em; }
  .smp canvas { width:100%; height:34px; opacity:0.8; }

  #emptyTray { align-self:center; font-size:0.72rem; letter-spacing:0.08em; color:rgba(250,248,245,0.4); padding:0 0.6rem; }

  #banner { position:fixed; left:50%; bottom:140px; transform:translateX(-50%); background:rgba(20,17,12,0.92); border:1px solid var(--line2); padding:0.5rem 0.9rem; font-size:0.78rem; letter-spacing:0.04em; border-radius:4px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; max-width:80vw; text-align:center; }
  #banner.show { opacity:1; }
  body.dropping::after { content:'drop audio to add it'; position:fixed; inset:0; background:rgba(198,123,92,0.18); border:3px dashed var(--terracotta); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond', serif; font-size:2.2rem; pointer-events:none; z-index:60; }

  @media (max-width:760px) {
    :root { --hdr-w:124px; --lane-h:64px; }

    #transport { padding:0.4rem 0.8rem; gap:0.4rem; }
    #pos { font-size:1.2rem; min-width:5.4rem; }
    #hint { display:none; }
    .hdr .pan { display:none; }
    .field.snapf { display:none; }
    #tray { max-height:100px; }
    .nav-content { flex-direction:column; align-items:flex-start; gap:0.4rem; }
    .logo { font-size:0.95rem; }
    .nav-links { gap:0.7rem 0.9rem; justify-content:flex-start; }
    .nav-links a { font-size:0.6rem; letter-spacing:0.12em; }
    #trayHead { padding:0.45rem 0.4rem; }
    #trayHead .tbtn { font-size:0.6rem; padding:0 0.3rem; letter-spacing:0.04em; }
  }
</style>

<script type="module">
const BUILD = "2026-10-03a";
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const COLORS = ["#8a5a44", "#5a7a6a", "#7a6a8a", "#8a7a3a", "#4f7a8a", "#8a4f6a", "#6a7a4a", "#8a6a4f"];

// ---------- project state (everything the ops touch) ----------
// This is the shape that will be shared through Firebase later: tracks + clips keyed by id,
// edits expressed as ops (commit()), replayable in any order per entity.
const proj = { bpm: 120, loop: { on: false, a: 0, b: 16 }, tracks: {}, clips: {} };
const audios = {};             // id -> { name, buf, peaks, dur }  (not shared; local decode cache)
let selected = new Set();      // clip ids
let selTrack = null;
let pxPerBeat = 28;            // zoom
let snapBeats = 0.25;
let playhead = 0;              // beats, when stopped
let undoStack = [], redoStack = [];

const tracksSorted = () => Object.values(proj.tracks).sort((a, b) => a.order - b.order);
const clipsOf = tid => Object.values(proj.clips).filter(c => c.track === tid);
const spb = () => 60 / proj.bpm;                     // seconds per beat
const clipEnd = c => c.start + c.len;
const projEndBeat = () => Math.max(16, ...Object.values(proj.clips).map(clipEnd)) ;

// ---------- ops ----------
// op = { t:"track"|"clip", id, ...fields } merge; { t, id, del:true } delete; { t:"set", k, v } project field.
function applyOp(op) {
  if (op.t === "set") { setPath(proj, op.k, op.v); return; }
  const col = op.t === "track" ? proj.tracks : proj.clips;
  if (op.del) { delete col[op.id]; if (op.t === "track") for (const c of clipsOf(op.id)) delete proj.clips[c.id]; selected.delete(op.id); return; }
  const cur = col[op.id] || (col[op.id] = { id: op.id });
  for (const k in op) if (k !== "t" && k !== "id" && k !== "del") cur[k] = op[k];
}
function setPath(o, k, v) { const p = k.split("."); for (let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = v; }
function getPath(o, k) { for (const s of k.split(".")) o = o[s]; return o; }
function inverseOf(op) {
  if (op.t === "set") return { t: "set", k: op.k, v: getPath(proj, op.k) };
  const col = op.t === "track" ? proj.tracks : proj.clips;
  const cur = col[op.id];
  if (op.del) {
    const inv = [{ t: op.t, id: op.id, ...cur }];
    if (op.t === "track") for (const c of clipsOf(op.id)) inv.push({ t: "clip", id: c.id, ...c });
    return inv;
  }
  if (!cur) return { t: op.t, id: op.id, del: true };
  const inv = { t: op.t, id: op.id };
  for (const k in op) if (k !== "t" && k !== "id") inv[k] = cur[k];
  return inv;
}
function commit(ops, { undoable = true } = {}) {
  ops = [].concat(ops);
  const inv = ops.map(inverseOf).flat().reverse();
  for (const op of ops) applyOp(op);
  if (undoable) { undoStack.push({ ops, inv }); redoStack.length = 0; if (undoStack.length > 200) undoStack.shift(); }
  afterChange(ops);
}
function undo() { const e = undoStack.pop(); if (!e) return; for (const op of e.inv) applyOp(op); redoStack.push(e); afterChange(e.inv); banner("undo"); }
function redo() { const e = redoStack.pop(); if (!e) return; for (const op of e.ops) applyOp(op); undoStack.push(e); afterChange(e.ops); banner("redo"); }
function afterChange(ops) {
  for (const id of [...selected]) if (!proj.clips[id]) selected.delete(id);
  if (ops.some(o => o.t === "set" && o.k === "bpm")) $("#bpm").value = proj.bpm;
  render();
  if (ops.some(o => o.t === "clip" || (o.t === "track" && o.del) || (o.t === "set" && (o.k === "bpm" || o.k.startsWith("loop"))))) engine.reschedule();
  engine.refreshMix();
  saveSoon();
}

// ---------- audio engine ----------
const engine = (() => {
  let ctx = null, master, playing = false, segs = [], scheduled = new Set(), live = [], timer = null;
  const LOOK = 0.18, TICK = 40;
  const trackNodes = {};      // tid -> { gain, pan, meterA }
  let clickOn = false, meterData = null;
  function ensure() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return ctx; }
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
    master = ctx.createGain(); master.connect(ctx.destination);
    return ctx;
  }
  function nodesFor(tid) {
    let n = trackNodes[tid];
    if (!n) {
      const gain = ctx.createGain(), pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null, an = ctx.createAnalyser();
      an.fftSize = 256;
      if (pan) { gain.connect(pan); pan.connect(an); } else gain.connect(an);
      an.connect(master);
      n = trackNodes[tid] = { gain, pan, an };
    }
    return n;
  }
  function refreshMix() {
    if (!ctx) return;
    const anySolo = Object.values(proj.tracks).some(t => t.solo);
    for (const t of Object.values(proj.tracks)) {
      const n = nodesFor(t.id), audible = !t.mute && (!anySolo || t.solo);
      n.gain.gain.setTargetAtTime(audible ? t.gain : 0, ctx.currentTime, 0.01);
      if (n.pan) n.pan.pan.setTargetAtTime(t.pan, ctx.currentTime, 0.01);
    }
    for (const s of live) if (s.gain && proj.clips[s.clip]) s.gain.gain.setTargetAtTime(proj.clips[s.clip].gain, ctx.currentTime, 0.01);
  }
  const ctxOf = (seg, beat) => seg.ctx0 + (beat - seg.startBeat) * spb();
  function segNow() {
    const now = ctx.currentTime;
    for (let i = segs.length - 1; i >= 0; i--) if (now >= segs[i].ctx0 - 1e-6) return segs[i];
    return segs[0];
  }
  function beatNow() {
    if (!playing) return playhead;
    const s = segNow(); if (!s) return playhead;
    return s.startBeat + Math.max(0, ctx.currentTime - s.ctx0) / spb();
  }
  function startFrom(beat) {
    ensure(); playing = true;
