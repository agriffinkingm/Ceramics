<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>music — alexander griffin king miller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Karla', sans-serif;
    background:#2C2820;
    color:#FAF8F5;
    overflow:hidden;
  }

  /* ---------- full-canvas image stream ---------- */
  #canvas {
    position:fixed; inset:0; background:#2C2820; overflow:hidden;
  }
  .slide {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 2.4s ease;
    transform-origin:center;
  }
  .slide.showing {
    opacity:1;
    animation:drift 14s ease-in-out forwards;
  }
  body.paused .slide.showing { animation-play-state:paused; }
  @keyframes drift {
    from { transform:scale(1.0); }
    to   { transform:scale(1.09); }
  }
  #canvas::after {
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(28,24,18,0.85) 0%, rgba(28,24,18,0.25) 35%, rgba(28,24,18,0.15) 60%, rgba(28,24,18,0.55) 100%);
    pointer-events:none;
  }

  /* ---------- nav ---------- */
  nav {
    position:fixed; top:0; left:0; right:0; z-index:20;
    padding:1.4rem 2.5rem;
  }
  .nav-content {
    display:flex; justify-content:space-between; align-items:center;
    max-width:1200px; margin:0 auto;
  }
  .logo {
    font-family:'Cormorant Garamond', serif;
    font-size:1.15rem; font-weight:400; letter-spacing:0.06em;
    color:#FAF8F5; text-shadow:0 1px 8px rgba(0,0,0,0.5);
  }
  .nav-links {
    display:flex; gap:2rem; list-style:none;
  }
  .nav-links a {
    color:rgba(250,248,245,0.85);
    text-decoration:none;
    font-size:0.78rem; letter-spacing:0.18em; text-transform:uppercase;
    padding-bottom:3px;
    border-bottom:1px solid transparent;
    transition:color .25s, border-color .25s;
    text-shadow:0 1px 6px rgba(0,0,0,0.5);
  }
  .nav-links a:hover { color:#FAF8F5; border-color:#C67B5C; }
  .nav-links a.active { color:#FAF8F5; border-color:#C67B5C; }

  /* ---------- now playing ---------- */
  #nowplaying {
    position:fixed; left:2.5rem; bottom:2.2rem; z-index:15;
    max-width:70vw;
    pointer-events:none;
  }
  #np-label {
    font-size:0.68rem; letter-spacing:0.28em; text-transform:uppercase;
    color:#C67B5C; margin-bottom:0.5rem;
    opacity:0; transition:opacity .8s;
  }
  #np-title {
    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size:clamp(2.2rem, 6vw, 4.6rem);
    line-height:1.05;
    text-shadow:0 2px 18px rgba(0,0,0,0.55);
    opacity:0; transform:translateY(12px);
    transition:opacity .8s, transform .8s;
  }
  #nowplaying.visible #np-label { opacity:1; }
  #nowplaying.visible #np-title { opacity:1; transform:translateY(0); }

  /* ---------- player panel (top left) ---------- */
  #panel {
    position:fixed; top:5.2rem; left:2.5rem; z-index:20;
    width:300px;
    max-height:calc(100vh - 12rem);
    display:flex; flex-direction:column;
    background:rgba(20,17,12,0.38);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(250,248,245,0.07);
  }

  /* ---------- auto-hide UI while playing ---------- */
  #panel, nav, #credit { transition:opacity .9s ease; }
  body.zen #panel, body.zen nav, body.zen #credit {
    opacity:0; pointer-events:none;
  }
  #knobrow {
    display:flex; gap:1.8rem;
    padding:0.9rem 1.1rem 0.6rem;
    border-bottom:1px solid rgba(250,248,245,0.1);
  }
  .knobwrap {
    display:flex; flex-direction:column; align-items:center; gap:0.3rem;
    width:66px; user-select:none;
  }
  .knob {
    width:46px; height:46px; border-radius:50%;
    background:rgba(250,248,245,0.07);
    border:1px solid rgba(250,248,245,0.35);
    position:relative; cursor:ns-resize; touch-action:none;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.35);
    transition:border-color .2s;
  }
  .knob:hover { border-color:#C67B5C; }
  .knob .ind {
    position:absolute; left:50%; top:4px;
    width:2px; height:13px; background:#C67B5C;
    transform-origin:50% 19px; border-radius:1px;
    transform:translateX(-50%);
  }
  .knob-label {
    font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase;
    color:rgba(250,248,245,0.6);
  }
  .knob-val {
    font-size:0.66rem; color:rgba(250,248,245,0.85);
    min-height:1em; font-variant-numeric:tabular-nums;
  }
  #controls {
    display:flex; align-items:center; gap:1rem;
    padding:0.7rem 1.1rem 0.5rem;
  }
  .ctl {
    background:none; border:none; color:#FAF8F5; cursor:pointer;
    padding:0.2rem; display:flex; align-items:center;
    opacity:0.85; transition:opacity .2s, transform .2s;
  }
  .ctl:hover { opacity:1; transform:scale(1.08); }
  .ctl svg { width:22px; height:22px; fill:currentColor; }
  #playbtn svg { width:32px; height:32px; }
  #time {
    margin-left:auto;
    font-size:0.7rem; letter-spacing:0.1em; color:rgba(250,248,245,0.75);
    font-variant-numeric:tabular-nums;
  }
  #progresswrap {
    height:14px; display:flex; align-items:center; cursor:pointer;
    padding:0 1.1rem; margin-bottom:0.4rem;
  }
  #progressbg {
    width:100%; height:2px; background:rgba(250,248,245,0.25);
    position:relative; transition:height .15s;
  }
  #progresswrap:hover #progressbg { height:4px; }
  #progressfill {
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:#C67B5C;
  }
  #tracklist {
    overflow-y:auto;
    border-top:1px solid rgba(250,248,245,0.1);
    padding:0.3rem 0 0.4rem;
    scrollbar-width:thin;
    scrollbar-color:rgba(250,248,245,0.25) transparent;
  }
  .track {
    padding:0.42rem 1.1rem; cursor:pointer;
    display:flex; align-items:baseline; gap:0.7rem;
    transition:background .2s;
  }
  .track:hover { background:rgba(250,248,245,0.07); }
  .track.current { color:#C67B5C; }
  .track .num {
    font-size:0.64rem; color:rgba(250,248,245,0.4);
    font-variant-numeric:tabular-nums; min-width:1.2em;
  }
  .track.current .num { color:#C67B5C; }
  .track .name { font-size:0.86rem; letter-spacing:0.04em; }

  /* ---------- empty state ---------- */
  #empty {
    position:fixed; inset:0; z-index:10;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:2rem; gap:1rem;
  }
  #empty.visible { display:flex; }
  #empty h1 {
    font-family:'Cormorant Garamond', serif; font-weight:300;
    font-size:clamp(2rem, 5vw, 3.2rem);
  }
  #empty p { color:rgba(250,248,245,0.6); font-size:0.9rem; letter-spacing:0.05em; max-width:34em; line-height:1.7; }

  #credit {
    position:fixed; right:2.5rem; bottom:0.4rem; z-index:15;
    font-size:0.6rem; letter-spacing:0.08em; color:rgba(250,248,245,0.35);
    text-decoration:none; pointer-events:auto;
  }
  #credit a { color:rgba(250,248,245,0.45); text-decoration:none; }

  @media (max-width:768px){
    nav { padding:1.1rem 1.3rem; }
    .nav-links { gap:1.1rem; }
    .nav-links a { font-size:0.68rem; letter-spacing:0.12em; }
    .logo { display:none; }
    #nowplaying { left:1.3rem; bottom:1.6rem; max-width:85vw; }
    #panel { left:1rem; top:4.2rem; width:min(260px, 74vw); max-height:calc(100vh - 13rem); }
    #controls { gap:0.7rem; padding:0.7rem 0.9rem 0.4rem; }
    .track { padding:0.38rem 0.9rem; }
    #credit { right:1.3rem; }
  }
</style>
</head>
<body>

<div id="canvas">
  <img class="slide" id="slideA" alt="" referrerpolicy="no-referrer">
  <img class="slide" id="slideB" alt="" referrerpolicy="no-referrer">
</div>

<nav>
  <div class="nav-content">
    <div class="logo">alexander griffin king miller</div>
    <ul class="nav-links">
      <li><a href="index.html#gallery">gallery</a></li>
      <li><a href="index.html#fingerstrument">fingerstrument</a></li>
      <li><a href="graff.html">graff</a></li>
      <li><a href="music.html" class="active">music</a></li>
      <li><a href="index.html#contact">contact</a></li>
    </ul>
  </div>
</nav>

<div id="empty">
  <h1>no songs yet</h1>
  <p>add tracks to the SONGS list at the top of the script in this file — each one needs a title and the path to its audio file in the repo.</p>
</div>

<div id="nowplaying">
  <div id="np-label">now playing</div>
  <div id="np-title"></div>
</div>

<div id="panel">
  <div id="knobrow"></div>
  <div id="controls">
    <button class="ctl" id="prevbtn" title="previous">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="ctl" id="playbtn" title="play / pause">
      <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <button class="ctl" id="nextbtn" title="next">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
    <span id="time">0:00 / 0:00</span>
  </div>
  <div id="progresswrap">
    <div id="progressbg"><div id="progressfill"></div></div>
  </div>
  <div id="tracklist"></div>
</div>

<div id="credit"><span id="creditsrc"></span></div>

<audio id="audio" preload="metadata"></audio>

<script>
/* ============================================================
   SONGS — add your tracks here.
   title : shown on screen AND used as the image search query
   file  : path to the audio file in this repo (e.g. music/song.mp3)
   query : OPTIONAL — set this to search images with different
           words than the title (e.g. add "ocean" or "painting")
   ============================================================ */
const SONGS = [
  { title: "airdrop",              file: "music/airdrop.mp3" },
  { title: "antielectron",         file: "music/antielectron.mp3", query: "positron antimatter" },
  { title: "artemis",              file: "music/artemis.mp3" },
  { title: "atouchakiss",          file: "music/atouchakiss.mp3", query: "a touch a kiss" },
  { title: "babyplease",           file: "music/babyplease.mp3", query: "baby please" },
  { title: "butterfly",            file: "music/butterfly.mp3" },
  { title: "celadon",              file: "music/celadon.mp3" },
  { title: "deadpuppylove",        file: "music/deadpuppylove.mp3", query: "dead puppy love" },
  { title: "eclipse",              file: "music/eclipse.mp3" },
  { title: "elastic",              file: "music/elastic.mp3" },
  { title: "euclid",               file: "music/euclid.mp3" },
  { title: "george",               file: "music/george.mp3" },
  { title: "kguy",                 file: "music/kguy.mp3", query: "k guy" },
  { title: "oxalis",               file: "music/oxalis.mp3" },
  { title: "prismatic",            file: "music/prismatic.mp3" },
  { title: "sapphicsapporoporous", file: "music/sapphicsapporoporous.mp3", query: "sapphic sapporo porous" },
  { title: "sentinel",             file: "music/sentinel.wav" },
  { title: "seolleongtang",        file: "music/seolleongtang.mp3" },
  { title: "swansong",             file: "music/swansong.mp3", query: "swan song" },
  { title: "zora",                 file: "music/zora.mp3" },
];

/* ============================================================
   GOOGLE IMAGES (optional).
   Leave both blank and the page uses the free Openverse photo
   API automatically. To use real Google Images results, paste
   your Google API key and Programmable Search Engine ID here:
   ============================================================ */
const GOOGLE_API_KEY = "";
const GOOGLE_CSE_ID  = "";

/* how often the background photo changes (milliseconds) */
const SLIDE_INTERVAL = 10000;

/* ------------------------------------------------------------ */
const audio     = document.getElementById('audio');
const playbtn   = document.getElementById('playbtn');
const iconPlay  = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');
const npWrap    = document.getElementById('nowplaying');
const npTitle   = document.getElementById('np-title');
const timeEl    = document.getElementById('time');
const fill      = document.getElementById('progressfill');
const slides    = [document.getElementById('slideA'), document.getElementById('slideB')];
const creditsrc = document.getElementById('creditsrc');

let current = -1;
let images = [];
let imgIndex = 0;
let frontSlide = 0;
let slideTimer = null;
let searchToken = 0;
const imageCache = new Map();

/* ---------- image search ---------- */
async function searchGoogle(q){
  const url = 'https://www.googleapis.com/customsearch/v1'
    + '?key=' + encodeURIComponent(GOOGLE_API_KEY)
    + '&cx='  + encodeURIComponent(GOOGLE_CSE_ID)
    + '&searchType=image&num=10&safe=active&imgSize=large'
    + '&q=' + encodeURIComponent(q);
  const r = await fetch(url);
  if(!r.ok) throw new Error('google ' + r.status);
  const d = await r.json();
  const urls = (d.items || []).map(i => i.link).filter(Boolean);
  if(!urls.length) throw new Error('google empty');
  return { urls, source: 'google images' };
}

async function searchOpenverse(q){
  const url = 'https://api.openverse.org/v1/images/'
    + '?q=' + encodeURIComponent(q)
    + '&page_size=20&mature=false';
  const r = await fetch(url);
  if(!r.ok) throw new Error('openverse ' + r.status);
  const d = await r.json();
  const urls = (d.results || []).map(i => i.url).filter(Boolean);
  return { urls, source: 'openverse' };
}

async function fetchImages(q){
  if(imageCache.has(q)) return imageCache.get(q);
  let result = { urls: [], source: '' };
  if(GOOGLE_API_KEY && GOOGLE_CSE_ID){
    try { result = await searchGoogle(q); }
    catch(e){ /* quota exhausted or misconfigured — fall through */ }
  }
  if(!result.urls.length){
    try { result = await searchOpenverse(q); }
    catch(e){ /* offline — canvas stays dark, player still works */ }
  }
  // shuffle
  for(let i = result.urls.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [result.urls[i], result.urls[j]] = [result.urls[j], result.urls[i]];
  }
  if(result.urls.length) imageCache.set(q, result);
  return result;
}

/* ---------- slideshow ---------- */
function showNextImage(token){
  if(token !== searchToken || !images.length) return;
  const url = images[imgIndex % images.length];
  imgIndex++;
  const back = 1 - frontSlide;
  const el = slides[back];
  const loader = new Image();
  loader.referrerPolicy = 'no-referrer';
  loader.onload = () => {
    if(token !== searchToken) return;
    el.src = url;
    // restart the drift animation
    el.classList.remove('showing');
    void el.offsetWidth;
    slides[frontSlide].classList.remove('showing');
    el.classList.add('showing');
    frontSlide = back;
  };
  loader.onerror = () => {
    // dead link (hotlink-blocked etc.) — drop it and try the next one
    if(token !== searchToken) return;
    images = images.filter(u => u !== url);
    if(images.length) showNextImage(token);
  };
  loader.src = url;
}

function startSlideshow(){
  if(slideTimer){ clearInterval(slideTimer); slideTimer = null; }
  if(audio.paused) return; // photos only run while music plays
  const token = searchToken;
  showNextImage(token);
  slideTimer = setInterval(() => showNextImage(token), SLIDE_INTERVAL);
}

async function loadVisuals(song){
  searchToken++;
  const token = searchToken;
  const q = song.query || song.title;
  const result = await fetchImages(q);
  if(token !== searchToken) return;
  images = result.urls.slice();
  imgIndex = 0;
  creditsrc.textContent = result.urls.length ? 'photos · ' + result.source : '';
  startSlideshow();
}

/* ---------- fx: filter + lfo knobs ---------- */
const KNOBS = {
  filter: { label:'filter', min:60, max:18000, log:true, def:18000, value:18000,
            fmt: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : Math.round(v)+'hz' },
  lfo:    { label:'lfo', min:0, max:12, log:false, def:0, value:0,
            fmt: v => v < 0.05 ? 'off' : v.toFixed(1)+'hz' }
};
let fx = null;

function ensureFx(){
  if(fx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  try {
    const ctx = new Ctx();
    const src = ctx.createMediaElementSource(audio);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = KNOBS.filter.value;
    filter.Q.value = 1.2;
    const lfoOsc = ctx.createOscillator();
    lfoOsc.type = 'sine';
    lfoOsc.frequency.value = 0.01;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0;
    lfoOsc.connect(lfoGain);
    lfoGain.connect(filter.frequency);
    lfoOsc.start();
    src.connect(filter);
    filter.connect(ctx.destination);
    fx = { ctx, filter, lfoOsc, lfoGain };
    applyFx();
  } catch(e){ fx = null; }
}

function applyFx(){
  if(!fx) return;
  const t = fx.ctx.currentTime;
  const cutoff = KNOBS.filter.value;
  const rate = KNOBS.lfo.value;
  fx.filter.frequency.setTargetAtTime(cutoff, t, 0.03);
  fx.lfoOsc.frequency.setTargetAtTime(Math.max(rate, 0.01), t, 0.03);
  // lfo sweeps the filter around its cutoff — deeper when the filter is more open
  fx.lfoGain.gain.setTargetAtTime(rate > 0.05 ? cutoff * 0.55 : 0, t, 0.03);
}

function knobNorm(k){
  const d = KNOBS[k];
  if(d.log) return (Math.log(d.value) - Math.log(d.min)) / (Math.log(d.max) - Math.log(d.min));
  return (d.value - d.min) / (d.max - d.min);
}
function knobSet(k, n){
  const d = KNOBS[k];
  n = Math.max(0, Math.min(1, n));
  d.value = d.log ? Math.exp(Math.log(d.min) + n * (Math.log(d.max) - Math.log(d.min)))
                  : d.min + n * (d.max - d.min);
}

function buildKnobs(){
  const row = document.getElementById('knobrow');
  Object.keys(KNOBS).forEach(k => {
    const d = KNOBS[k];
    const wrap = document.createElement('div'); wrap.className = 'knobwrap';
    const knob = document.createElement('div'); knob.className = 'knob';
    const ind = document.createElement('div'); ind.className = 'ind';
    knob.appendChild(ind);
    const label = document.createElement('div'); label.className = 'knob-label'; label.textContent = d.label;
    const val = document.createElement('div'); val.className = 'knob-val';
    wrap.appendChild(knob); wrap.appendChild(label); wrap.appendChild(val);
    row.appendChild(wrap);
    function paint(){
      ind.style.transform = 'translateX(-50%) rotate(' + (-135 + knobNorm(k) * 270) + 'deg)';
      val.textContent = d.fmt(d.value);
    }
    paint();
    let dragging = false, startY = 0, startN = 0;
    knob.addEventListener('pointerdown', e => {
      e.preventDefault();
      dragging = true; startY = e.clientY; startN = knobNorm(k);
      knob.setPointerCapture(e.pointerId);
      ensureFx();
    });
    knob.addEventListener('pointermove', e => {
      if(!dragging) return;
      knobSet(k, startN + (startY - e.clientY) / 150);
      paint(); applyFx();
    });
    const stop = () => { dragging = false; };
    knob.addEventListener('pointerup', stop);
    knob.addEventListener('pointercancel', stop);
    knob.addEventListener('dblclick', () => { d.value = d.def; paint(); applyFx(); });
  });
}
buildKnobs();

/* ---------- player ---------- */
function fmt(t){
  if(!isFinite(t)) return '0:00';
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function playSong(i){
  if(!SONGS.length) return;
  current = ((i % SONGS.length) + SONGS.length) % SONGS.length;
  const song = SONGS[current];
  audio.src = song.file;
  audio.play().catch(()=>{});
  npTitle.textContent = song.title;
  npWrap.classList.add('visible');
  document.title = song.title + ' — alexander griffin king miller';
  renderList();
  loadVisuals(song);
}

function togglePlay(){
  if(current < 0){ playSong(0); return; }
  if(audio.paused) audio.play().catch(()=>{});
  else audio.pause();
}

playbtn.addEventListener('click', togglePlay);
document.getElementById('nextbtn').addEventListener('click', () => playSong(current + 1));
document.getElementById('prevbtn').addEventListener('click', () => {
  if(audio.currentTime > 3) audio.currentTime = 0;
  else playSong(current - 1);
});

audio.addEventListener('play',  () => {
  ensureFx();
  if(fx && fx.ctx.state === 'suspended') fx.ctx.resume();
  iconPlay.style.display = 'none'; iconPause.style.display = '';
  document.body.classList.remove('paused');
  if(!slideTimer && images.length) startSlideshow(); // resume photos
  scheduleHide();
});
audio.addEventListener('pause', () => {
  iconPlay.style.display = '';     iconPause.style.display = 'none';
  document.body.classList.add('paused');
  if(slideTimer){ clearInterval(slideTimer); slideTimer = null; } // freeze photos
  showUI();
});
audio.addEventListener('ended', () => playSong(current + 1));
let errStreak = 0;
audio.addEventListener('error', () => {
  // missing/broken file — skip ahead, but stop if every track fails
  if(++errStreak >= SONGS.length) return;
  setTimeout(() => playSong(current + 1), 800);
});
audio.addEventListener('playing', () => { errStreak = 0; });
audio.addEventListener('timeupdate', () => {
  fill.style.width = (audio.duration ? (audio.currentTime / audio.duration * 100) : 0) + '%';
  timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
});

document.getElementById('progresswrap').addEventListener('click', e => {
  if(!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

document.addEventListener('keydown', e => {
  if(e.code === 'Space' && e.target === document.body){ e.preventDefault(); togglePlay(); }
});

/* ---------- track list ---------- */
function renderList(){
  const box = document.getElementById('tracklist');
  box.innerHTML = '';
  SONGS.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'track' + (i === current ? ' current' : '');
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = i === current ? '♪' : (i + 1);
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = s.title;
    row.appendChild(num); row.appendChild(name);
    row.addEventListener('click', () => playSong(i));
    box.appendChild(row);
  });
}

/* ---------- auto-hide UI ----------
   while music plays, the panel / nav / credit fade away after a few
   seconds of stillness; any touch or mouse move brings them back. */
const HIDE_DELAY = 4000;
let hideTimer = null;
function scheduleHide(){
  if(hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if(!audio.paused) document.body.classList.add('zen');
  }, HIDE_DELAY);
}
function showUI(){
  document.body.classList.remove('zen');
  scheduleHide();
}
['pointerdown','pointermove','touchstart','keydown'].forEach(ev =>
  document.addEventListener(ev, showUI, { passive:true }));

/* ---------- init ---------- */
if(SONGS.length){
  renderList();
  current = -1;
  // canvas stays dark until play is pressed — photos start with the music
} else {
  document.getElementById('empty').classList.add('visible');
}
</script>
</body>
</html>
