<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>sex? — who made it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Karla:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --plaster: #E4DBD0;
    --plaster-deep: #D6CBBE;
    --ivory: #FAF8F5;
    --clay-dark: #8B7968;
    --terracotta: #C67B5C;
    --stone: #4A4238;
    --charcoal: #2C2820;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Karla', sans-serif;
    font-weight: 300;
    background: var(--plaster);
    color: var(--charcoal);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    overflow: hidden;
  }

  /* top bar */
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 1.1rem 1.4rem 0;
    font-size: .85rem; letter-spacing: .08em;
  }
  header a { color: var(--stone); text-decoration: none; }
  header a:hover { color: var(--terracotta); }
  header .title { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 300; letter-spacing: .02em; font-style: italic; }

  /* the wall */
  #wall {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 1.2rem 1.4rem .6rem;
    position: relative;
  }
  #art {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    box-shadow: 0 2px 0 rgba(255,255,255,.35), 0 18px 40px -18px rgba(44,40,32,.5);
    background: var(--ivory);
    opacity: 0; transition: opacity .5s ease;
  }
  #art.shown { opacity: 1; }
  #empty {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 2rem; color: var(--stone);
    font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; line-height: 1.4;
  }
  #empty.shown { display: flex; }

  /* the wall label */
  #label {
    flex: 0 0 auto;
    margin: 0 auto 1.6rem;
    width: min(92vw, 460px);
    background: var(--ivory);
    padding: 1.1rem 1.4rem 1.2rem;
    box-shadow: 0 1px 0 rgba(255,255,255,.5), 0 10px 26px -14px rgba(44,40,32,.45);
    position: relative;
  }
  #label::after { /* the pin */
    content: ''; position: absolute; top: -5px; left: 50%; width: 8px; height: 8px;
    margin-left: -4px; border-radius: 50%; background: var(--clay-dark);
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  #q {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 300;
    font-size: 1.9rem; line-height: 1.1;
    color: var(--charcoal);
    margin-bottom: .8rem;
  }
  .poll { margin-bottom: .9rem; }
  .poll:last-of-type { margin-bottom: 0; }
  .poll h3 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 1.25rem; color: var(--stone); margin-bottom: .4rem; }
  .choices { display: flex; gap: .4rem; }
  .choices button {
    flex: 1 1 0;
    font: inherit; font-size: .9rem; letter-spacing: .04em;
    background: none; border: 1px solid var(--plaster-deep); color: var(--stone);
    padding: .6rem .3rem; cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
  }
  .choices button:hover, .choices button:focus-visible { border-color: var(--terracotta); color: var(--terracotta); outline: none; }
  .choices button:disabled { cursor: default; opacity: .5; }
  .poll.done .choices { display: none; }
  .tally { display: none; }
  .poll.done .tally { display: block; }
  #after { display: none; }
  #after.shown { display: block; }
  .row { display: grid; grid-template-columns: 6.4em 1fr 3.2em; align-items: center; gap: .6rem; font-size: .9rem; color: var(--stone); margin: .35rem 0; }
  .row .bar { height: 2px; background: var(--plaster-deep); position: relative; }
  .row .bar i { position: absolute; left: 0; top: -1px; height: 4px; width: 0; background: var(--stone); transition: width .7s cubic-bezier(.2,.7,.2,1); }
  .row.mine { color: var(--terracotta); }
  .row.mine .bar i { background: var(--terracotta); }
  .row .n { text-align: right; font-variant-numeric: tabular-nums; }
  .count { font-size: .78rem; color: var(--clay-dark); margin-top: .3rem; }
  #who { display: none; margin-top: .6rem; font-size: .85rem; }
  #who.shown { display: block; }
  #who button { font: inherit; background: none; border: 0; padding: 0; color: var(--clay-dark); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  #who button:hover { color: var(--terracotta); }
  #who .ans { display: none; color: var(--charcoal); }
  #who .ans a { color: var(--terracotta); word-break: break-all; }
  #who .ans a:not([href]) { display: none; }
  #who.open button { display: none; }
  #who.open .ans { display: block; }

  /* hang form */
  #hangform { display: none; }
  #hangform.shown { display: block; }
  #hangform p { font-size: .85rem; color: var(--stone); margin-bottom: .5rem; }
  #link, #artist { width: 100%; font: inherit; font-size: .9rem; padding: .5rem .6rem; border: 1px solid var(--plaster-deep); background: var(--ivory); color: var(--charcoal); margin-bottom: .5rem; }
  #link:focus, #artist:focus { outline: none; border-color: var(--terracotta); }
  #hangform .btns { display: flex; gap: .4rem; }
  #hangform .btns button { flex: 1 1 0; font: inherit; font-size: .9rem; letter-spacing: .06em; padding: .65rem; cursor: pointer; border: 1px solid var(--stone); }
  #hang-go { background: var(--stone); color: var(--ivory); }
  #hang-no { background: none; color: var(--stone); }
  #next {
    display: block; margin-top: .8rem; width: 100%;
    font: inherit; font-size: .9rem; letter-spacing: .06em;
    background: var(--stone); color: var(--ivory); border: 0; padding: .65rem; cursor: pointer;
  }
  #next:hover { background: var(--charcoal); }

  /* hang a piece */
  #hang { font-size: .85rem; letter-spacing: .08em; }
  #file { display: none; }
  #toast {
    position: fixed; left: 50%; top: 3.6rem; transform: translateX(-50%);
    background: var(--charcoal); color: var(--ivory); font-size: .85rem;
    padding: .5rem .9rem; opacity: 0; pointer-events: none; transition: opacity .3s; white-space: nowrap;
  }
  #toast.shown { opacity: 1; }

  @media (max-width: 560px) {
    #q { font-size: 1.6rem; }
    #label { padding: .9rem 1rem 1rem; margin-bottom: max(1rem, env(safe-area-inset-bottom)); }
    .choices button { font-size: .82rem; padding: .55rem .2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    #art, .row .bar i, #toast { transition: none; }
  }
</style>
</head>
<body>
<header>
  <a href="index.html">← griffin</a>
  <span class="title">sex?</span>
  <label id="hang"><a href="#" id="hang-a">hang a piece</a><input type="file" id="file" accept="image/*"></label>
</header>

<div id="wall">
  <img id="art" alt="an artwork">
  <div id="empty"></div>
</div>

<div id="label">
  <div id="q">Who made it?</div>
  <div id="polls">
    <div class="poll" data-p="sex">
      <div class="choices">
        <button data-c="man">Man</button>
        <button data-c="woman">Woman</button>
        <button data-c="nb">Non-binary</button>
      </div>
      <div class="tally">
        <div class="row" data-c="man"><span>Man</span><span class="bar"><i></i></span><span class="n">–</span></div>
        <div class="row" data-c="woman"><span>Woman</span><span class="bar"><i></i></span><span class="n">–</span></div>
        <div class="row" data-c="nb"><span>Non-binary</span><span class="bar"><i></i></span><span class="n">–</span></div>
        <div class="count"></div>
      </div>
    </div>
    <div class="poll" data-p="or">
      <div class="choices">
        <button data-c="straight">Straight</button>
        <button data-c="gay">Gay</button>
      </div>
      <div class="tally">
        <div class="row" data-c="straight"><span>Straight</span><span class="bar"><i></i></span><span class="n">–</span></div>
        <div class="row" data-c="gay"><span>Gay</span><span class="bar"><i></i></span><span class="n">–</span></div>
        <div class="count"></div>
      </div>
    </div>
  </div>
  <div id="after">
    <div id="who"><button type="button">who actually made it?</button><div class="ans"><span class="nm"></span> <a target="_blank" rel="noopener"></a></div></div>
    <button id="next">Next piece</button>
  </div>
  <div id="hangform">
    <p>Who actually made it? Voters can look this up after they vote.</p>
    <input id="artist" type="text" placeholder="Artist's name" autocomplete="off" maxlength="120">
    <input id="link" type="url" placeholder="Link about them (optional)" autocomplete="off" spellcheck="false">
    <div class="btns"><button id="hang-no" type="button">Cancel</button><button id="hang-go" type="button">Hang it</button></div>
  </div>
</div>
<div id="toast"></div>

<script type="module">
const BUILD = "2026-09-08c";
const DB = "https://griffgraff-baa46-default-rtdb.firebaseio.com";
const firebaseConfig = {
  apiKey: "AIzaSyBFhPRrarZGldaVHuDgtm6htTM7HoHNz8I",
  authDomain: "griffgraff-baa46.firebaseapp.com",
  databaseURL: DB,
  projectId: "griffgraff-baa46",
  storageBucket: "griffgraff-baa46.firebasestorage.app",
  messagingSenderId: "354313176929",
  appId: "1:354313176929:web:65aa8467f9aad220026720",
  measurementId: "G-7KC0BJ1LYG"
};
const MAX_SIDE = 1400, MAX_CHARS = 900_000;
const POLLS = { sex: ["man", "woman", "nb"], or: ["straight", "gay"] };

const $ = s => document.querySelector(s);
const artEl = $("#art"), emptyEl = $("#empty"), pollsEl = $("#polls"), afterEl = $("#after"),
      nextBtn = $("#next"), fileEl = $("#file"), toastEl = $("#toast"),
      qEl = $("#q"), whoEl = $("#who"), hangForm = $("#hangform"), linkEl = $("#link"), artistEl = $("#artist");
let pending = null;     // { img, dataUrl } waiting for the hang form

let fb = null;          // { ref, push, set, get, runTransaction, onValue }
let keys = [];          // all artwork keys
let cur = null;         // current key
let hist = [];          // keys already shown this session (for ← back)
let unsubs = [];        // onValue unsubscribes for the tallies
let toastT;

function toast(msg, ms = 2500) {
  toastEl.textContent = msg; toastEl.classList.add("shown");
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("shown"), ms);
}
function myVotes() { try { return JSON.parse(localStorage.getItem("sexvotes2") || "{}"); } catch { return {}; } }
function setVote(k, p, c) { const v = myVotes(); v[k] = Object.assign(v[k] || {}, { [p]: c }); localStorage.setItem("sexvotes2", JSON.stringify(v)); }
function voted(k) { const v = myVotes()[k]; return v && (v.sex || v.or); }
function stopTallies() { unsubs.forEach(f => f()); unsubs = []; }
function resetPolls() {
  pollsEl.querySelectorAll(".poll").forEach(p => p.classList.remove("done"));
  pollsEl.querySelectorAll("button").forEach(b => b.disabled = false);
  afterEl.classList.remove("shown");
}

function showEmpty(msg) {
  artEl.classList.remove("shown"); artEl.removeAttribute("src");
  emptyEl.textContent = msg; emptyEl.classList.add("shown");
  pollsEl.style.display = "none"; afterEl.classList.remove("shown");
}

/* ---------- picking ---------- */
async function fetchKeys() {
  const r = await fetch(`${DB}/polls/art.json?shallow=true`);
  if (!r.ok) throw new Error("keys " + r.status);
  const j = await r.json();
  keys = j ? Object.keys(j) : [];
}
function pickKey() {
  const voted = myVotes();
  const fresh = keys.filter(k => !(voted[k] && voted[k].sex && voted[k].or) && k !== cur);
  const pool = fresh.length ? fresh : keys.filter(k => k !== cur);
  if (!pool.length) return keys[0] || null;
  return pool[Math.floor(Math.random() * pool.length)];
}
async function show(key, back) {
  stopTallies();
  if (cur && !back && hist[hist.length - 1] !== cur) hist.push(cur);
  cur = key;
  emptyEl.classList.remove("shown");
  artEl.classList.remove("shown");
  pollsEl.style.display = "";
  resetPolls();
  const snap = await fb.get(fb.ref(fb.db, `polls/art/${key}`));
  const a = snap.val();
  if (!a || !a.img) { keys = keys.filter(k => k !== key); return next(); }
  setWho(a.artist, a.link);
  await new Promise(res => { artEl.onload = res; artEl.onerror = res; artEl.src = a.img; });
  artEl.classList.add("shown");
  const mine = myVotes()[key] || {};
  for (const p in POLLS) if (mine[p]) revealTally(key, p, mine[p]);
}
function next() {
  if (!keys.length) return showEmpty("Nothing on the wall yet — hang a piece.");
  const k = pickKey();
  if (!k) return showEmpty("Nothing on the wall yet — hang a piece.");
  show(k);
}

/* ---------- voting ---------- */
pollsEl.addEventListener("click", async e => {
  const btn = e.target.closest("button[data-c]");
  if (!btn || !cur || !fb) return;
  const pollEl = btn.closest(".poll"), p = pollEl.dataset.p, c = btn.dataset.c, key = cur;
  pollEl.querySelectorAll("button").forEach(b => b.disabled = true);
  try {
    await fb.runTransaction(fb.ref(fb.db, `polls/votes/${key}/${p}/${c}`), n => (n || 0) + 1);
    setVote(key, p, c);
    if (cur === key) revealTally(key, p, c);
  } catch (err) {
    console.error(err);
    pollEl.querySelectorAll("button").forEach(b => b.disabled = false);
    toast("Couldn't cast that vote — try again");
  }
});
function setWho(name, link) {
  whoEl.classList.remove("open");
  const okLink = typeof link === "string" && /^https?:\/\//i.test(link);
  const okName = typeof name === "string" && name.trim().length > 0;
  whoEl.classList.toggle("shown", okName || okLink);
  whoEl.querySelector(".nm").textContent = okName ? name.trim() : "";
  const a = whoEl.querySelector("a");
  if (okLink) { a.href = link; a.textContent = okName ? "↗" : link.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, ""); }
  else { a.removeAttribute("href"); a.textContent = ""; }
}
whoEl.querySelector("button").addEventListener("click", () => whoEl.classList.add("open"));
function revealTally(key, p, mine) {
  const pollEl = pollsEl.querySelector(`.poll[data-p="${p}"]`);
  pollEl.classList.add("done");
  afterEl.classList.add("shown");
  unsubs.push(fb.onValue(fb.ref(fb.db, `polls/votes/${key}/${p}`), snap => {
    const v = snap.val() || {};
    const total = POLLS[p].reduce((s, c) => s + (v[c] || 0), 0);
    pollEl.querySelectorAll(".row").forEach(row => {
      const c = row.dataset.c, n = v[c] || 0, pct = total ? Math.round(100 * n / total) : 0;
      row.classList.toggle("mine", c === mine);
      row.querySelector(".n").textContent = total ? pct + "%" : "–";
      requestAnimationFrame(() => row.querySelector("i").style.width = pct + "%");
    });
    pollEl.querySelector(".count").textContent = total === 1 ? "1 vote" : `${total} votes`;
  }));
}
function prev() {
  if (!hist.length) return;
  show(hist.pop(), true);
}
nextBtn.addEventListener("click", next);
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || pending) return;
  if (e.key === "ArrowRight") { e.preventDefault(); next(); }        // skip without voting
  if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  if (e.key === " " && afterEl.classList.contains("shown")) { e.preventDefault(); next(); }
  const k = { "1": ["sex", 0], "2": ["sex", 1], "3": ["sex", 2], "4": ["or", 0], "5": ["or", 1] }[e.key];
  if (k) { const b = pollsEl.querySelectorAll(`.poll[data-p="${k[0]}"] .choices button`)[k[1]]; if (b && !b.disabled) b.click(); }
});

/* ---------- hanging ---------- */
$("#hang-a").addEventListener("click", e => { e.preventDefault(); fileEl.click(); });
fileEl.addEventListener("change", async () => {
  const f = fileEl.files[0]; fileEl.value = "";
  if (!f) return;
  if (!fb) return toast("Not connected — can't hang anything right now");
  try {
    const img = await loadFile(f);
    pending = { img, dataUrl: shrink(img) };
    stopTallies();
    emptyEl.classList.remove("shown");
    artEl.classList.remove("shown");
    await new Promise(res => { artEl.onload = res; artEl.onerror = res; artEl.src = pending.dataUrl; });
    artEl.classList.add("shown");
    qEl.textContent = "Hang this?";
    pollsEl.style.display = "none"; afterEl.classList.remove("shown");
    linkEl.value = ""; artistEl.value = ""; hangForm.classList.add("shown"); artistEl.focus();
  } catch (err) {
    console.error(err);
    toast("Couldn't read that one — " + (err.message || "try another image"));
  }
});
function closeHang() {
  pending = null; hangForm.classList.remove("shown"); qEl.textContent = "Who made it?";
}
$("#hang-no").addEventListener("click", () => { closeHang(); cur ? show(cur) : next(); });
$("#hang-go").addEventListener("click", async () => {
  if (!pending) return;
  const name = artistEl.value.trim();
  if (!name) { toast("Who made it? Add the artist's name"); artistEl.focus(); return; }
  let link = linkEl.value.trim();
  if (link && !/^https?:\/\//i.test(link)) link = "https://" + link;
  if (link && !/^https?:\/\/[^\s]+\.[^\s]+/i.test(link)) { toast("That link doesn't look right"); linkEl.focus(); return; }
  const { img, dataUrl } = pending;
  $("#hang-go").disabled = true; toast("Hanging…", 60000);
  try {
    const r = fb.push(fb.ref(fb.db, "polls/art"));
    const rec = { img: dataUrl, w: img.naturalWidth, h: img.naturalHeight, t: Date.now() };
    rec.artist = name;
    if (link) rec.link = link;
    await fb.set(r, rec);
    keys.push(r.key);
    closeHang(); toast("Hung.");
    show(r.key);
  } catch (err) {
    console.error(err);
    toast("Couldn't hang that one — " + (err.message || "try again"));
  }
  $("#hang-go").disabled = false;
});
for (const el of [linkEl, artistEl]) el.addEventListener("keydown", e => { if (e.key === "Enter") $("#hang-go").click(); if (e.key === "Escape") $("#hang-no").click(); });
function loadFile(f) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("not an image the browser can read")); };
    img.src = url;
  });
}
function shrink(img) {
  let w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) throw new Error("empty image");
  let s = Math.min(1, MAX_SIDE / Math.max(w, h));
  for (let tries = 0; tries < 8; tries++) {
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(w * s)); cv.height = Math.max(1, Math.round(h * s));
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#FAF8F5"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const out = cv.toDataURL("image/jpeg", 0.86);
    if (out.length <= MAX_CHARS) return out;
    s *= 0.8;
  }
  throw new Error("image too large");
}

/* ---------- boot ---------- */
(async () => {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const m = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const app = initializeApp(firebaseConfig);
    fb = { db: m.getDatabase(app), ref: m.ref, push: m.push, set: m.set, get: m.get, runTransaction: m.runTransaction, onValue: m.onValue };
    await fetchKeys();
    next();
  } catch (err) {
    console.error(err);
    showEmpty("Couldn't reach the wall. Check your connection and reload.");
  }
})();
window.__sexBuild = BUILD;
</script>
</body>
</html>
