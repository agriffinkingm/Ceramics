name: daily news backdrop

# Two jobs in one workflow:
#  • FULL pick — the day's backdrop (bg/current.*). Meant for 02:33 America/New_York, an
#    hour before the wall's 03:33 turnover — but GitHub fires scheduled runs hours late
#    on this repo, so the guard no longer looks at the clock: the FIRST run after 02:30 NY
#    whose bg/current.json is not stamped with today's NY date does the pick. Any later
#    run that day (or a run before 02:30) tops up the pool instead. A pick that fails to
#    write current.* just gets retried by the next run.
#  • POOL top-up every 6 hours — adds up to three fresh, wide, mutually different scenes
#    from around the world to bg/pool.json for the wall's 🗞 Fresh news button.
on:
  schedule:
    - cron: "33 6 * * *"      # 02:33 EDT (UTC-4)  → full (whichever fires first after 02:30 NY)
    - cron: "33 7 * * *"      # 02:33 EST (UTC-5)  → full / pool
    - cron: "11 */6 * * *"    # every 6h            → pool (4 runs/day ≈ 12 new scenes; each run = ~14 vision calls of pollen)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = pick today's backdrop · pool = top up the Fresh-news pool"
        default: pool
        type: choice
        options: [pool, full]

permissions:
  contents: write

concurrency:
  group: daily-bg
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: decide mode
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          HHMM=$(TZ=America/New_York date +%H%M)
          CUR=$(python3 -c "import json;print(json.load(open('bg/current.json')).get('id',''))" 2>/dev/null || echo none)
          echo "New York $TODAY $HHMM, current backdrop id $CUR"
          if [ "$((10#$HHMM))" -ge 230 ] && [ "$CUR" != "$TODAY" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"; echo "no backdrop for $TODAY yet — picking one"
          else
            echo "mode=pool" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow

      - name: pick today's backdrop
        if: steps.guard.outputs.mode == 'full'
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: python bg/pick_bg.py

      - name: top up the pool
        if: steps.guard.outputs.mode == 'pool'
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: python bg/pick_bg.py --pool

      - name: commit
        run: |
          git config user.name "graff-bot"
          git config user.email "graff-bot@users.noreply.github.com"
          git add bg/current.jpg bg/current.json bg/history.json 2>/dev/null || true
          if [ -f bg/prev.jpg ]; then git add bg/prev.jpg bg/prev.json; fi
          if [ -f bg/pool.json ]; then git add -A bg/pool.json; git add -A bg/pool-*.jpg 2>/dev/null || true; git add -u bg/; fi
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          if [ "${{ steps.guard.outputs.mode }}" = "full" ]; then
            MSG="bg: $(python -c "import json;print(json.load(open('bg/current.json'))['headline'][:72])")"
          else
            MSG="bg: pool +$(python -c "import json;p=json.load(open('bg/pool.json'));print(len(p))") backdrops"
          fi
          git commit -m "$MSG"
          git push
