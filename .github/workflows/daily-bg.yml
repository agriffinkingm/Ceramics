name: daily news backdrop

# Two jobs in one workflow:
#  • FULL pick — a wall-day's backdrop (bg/current.*). The wall turns over at 03:33
#    America/New_York and must show a NEW photo at that moment, but GitHub fires scheduled
#    runs hours late on this repo — so the pick is made A DAY AHEAD. The guard looks only
#    at state: the wall-day is the NY date of (now − 3h33m);
#      current.json older than the wall-day   → pick for the wall-day now (catch-up),
#      current.json is the wall-day's          → pick TOMORROW's (the page keeps showing
#                                                prev.* until tomorrow's 03:33),
#      current.json is already tomorrow's      → top up the pool instead.
#    A pick that fails to write current.* just gets retried by the next run.
#  • POOL top-up every 6 hours — adds up to three fresh, wide, mutually different scenes
#    from around the world to bg/pool.json for the wall's 🗞 Fresh news button.
on:
  schedule:
    - cron: "33 6 * * *"      # 02:33 EDT (UTC-4)  → full (whichever fires first after 02:30 NY)
    - cron: "33 7 * * *"      # 02:33 EST (UTC-5)  → full / pool
    - cron: "11 */6 * * *"    # every 6h            → pool (4 runs/day ≈ 12 new scenes; each run = ~14 vision calls of pollen)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = pick the next backdrop the wall is missing (today's, else tomorrow's) · pool = top up the Fresh-news pool"
        default: pool
        type: choice
        options: [pool, full]

permissions:
  contents: write

concurrency:
  group: daily-bg
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: decide mode
        id: guard
        run: |
          WALLDAY=$(TZ=America/New_York date -d '3 hours ago 33 minutes ago' +%Y-%m-%d)
          NEXT=$(date -d "$WALLDAY 12:00 +1 day" +%Y-%m-%d)
          CUR=$(python3 -c "import json;print(json.load(open('bg/current.json')).get('id',''))" 2>/dev/null || echo "")
          echo "wall-day $WALLDAY, next $NEXT, current backdrop id '$CUR'"
          # ISO dates sort as text
          if [[ "$CUR" < "$WALLDAY" ]]; then DAY=$WALLDAY; MODE=full
          elif [[ "$CUR" < "$NEXT" ]]; then DAY=$NEXT; MODE=full
          else DAY=$NEXT; MODE=pool; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"   # manual "full" re-picks the day worked out above
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "→ $MODE (backdrop day $DAY)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow

      - name: pick a wall-day's backdrop
        if: steps.guard.outputs.mode == 'full'
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          BG_DAY: ${{ steps.guard.outputs.day }}
        run: python bg/pick_bg.py

      - name: top up the pool
        if: steps.guard.outputs.mode == 'pool'
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: python bg/pick_bg.py --pool

      - name: commit
        run: |
          git config user.name "graff-bot"
          git config user.email "graff-bot@users.noreply.github.com"
          git add bg/current.jpg bg/current.json bg/history.json 2>/dev/null || true
          if [ -f bg/prev.jpg ]; then git add bg/prev.jpg bg/prev.json; fi
          if [ -f bg/pool.json ]; then git add -A bg/pool.json; git add -A bg/pool-*.jpg 2>/dev/null || true; git add -u bg/; fi
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          if [ "${{ steps.guard.outputs.mode }}" = "full" ]; then
            MSG="bg: $(python -c "import json;print(json.load(open('bg/current.json'))['headline'][:72])")"
          else
            MSG="bg: pool +$(python -c "import json;p=json.load(open('bg/pool.json'));print(len(p))") backdrops"
          fi
          git commit -m "$MSG"
          git push
