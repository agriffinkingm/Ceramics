<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>compendium — walls that survived</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --room: #0c0b09;        /* warm black projection room */
    --bone: #d8d2c4;        /* caption ink */
    --dim: #6f6a5e;
    --concrete: #b7b2a8;    /* the wall's own color */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--room);
    color: var(--bone);
    font-family: "Cormorant Garamond", Georgia, serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }

  /* ---- slides: two stacked layers crossfading ---- */
  #stage { position: fixed; inset: 0; }
  .layer {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  .layer.on { opacity: 1; }
  .layer img {
    max-width: 92vw; max-height: 84vh;
    object-fit: contain;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
  }
  /* whisper of ken burns while a slide is up */
  .layer.on img { animation: kb 9s ease-in-out forwards; }
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.035); } }

  /* ---- chrome ---- */
  .nav {
    position: fixed; top: 14px; left: 16px; z-index: 5;
    font-family: system-ui, sans-serif; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase;
  }
  .nav a { color: var(--dim); text-decoration: none; margin-right: 16px; }
  .nav a:hover, .nav a:focus-visible { color: var(--bone); }
  a:focus-visible, button:focus-visible { outline: 1px solid var(--concrete); outline-offset: 3px; }

  #caption {
    position: fixed; left: 20px; bottom: 18px; z-index: 5;
    font-size: 21px; font-style: italic; font-weight: 400;
    color: var(--bone);
    text-shadow: 0 1px 8px rgba(0,0,0,.8);
    opacity: 0; transition: opacity 1.4s ease;
  }
  #caption.on { opacity: 1; }
  #caption .fate { color: var(--concrete); }

  #counter {
    position: fixed; right: 20px; bottom: 20px; z-index: 5;
    font-family: system-ui, sans-serif; font-size: 10px;
    letter-spacing: .14em; color: var(--dim);
  }
  #pause-dot {
    position: fixed; right: 20px; top: 16px; z-index: 5;
    font-family: system-ui, sans-serif; font-size: 10px;
    letter-spacing: .14em; color: var(--dim);
    display: none;
  }
  body.paused #pause-dot { display: block; }

  /* invisible page-turn halves */
  .turn {
    position: fixed; top: 0; bottom: 0; width: 50%;
    background: none; border: none; z-index: 4; cursor: pointer;
  }
  #prev { left: 0; cursor: w-resize; }
  #next { right: 0; cursor: e-resize; }

  /* ---- contact sheet: click the dark around a slide (or press G) ---- */
  #grid {
    position: fixed; inset: 0; z-index: 7;
    background: var(--room);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 56px 20px 40px;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
  }
  #grid.on { opacity: 1; pointer-events: auto; }
  #grid-list {
    display: grid; gap: 22px 18px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    max-width: 1500px; margin: 0 auto;
  }
  .cell {
    display: block; width: 100%; text-align: left;
    background: none; border: none; padding: 0; cursor: pointer;
    color: var(--dim); font: inherit;
  }
  .cell img {
    display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
    background: #17150f;
    outline: 1px solid transparent; outline-offset: 3px;
    transition: outline-color .15s ease, transform .15s ease;
  }
  .cell:hover img, .cell:focus-visible img { outline-color: var(--dim); transform: scale(1.015); }
  .cell.cur img { outline-color: var(--concrete); }
  .cell:focus-visible { outline: none; }
  .cell > span { display: block; margin-top: 8px; font-size: 15px; font-style: italic; }
  .cell.cur > span, .cell:hover > span { color: var(--bone); }
  .cell .fate { color: var(--concrete); }
  body.grid .nav { z-index: 8; }
  body.grid #pause-dot { display: none; }

  /* ---- title card / empty / error ---- */
  #card {
    position: fixed; inset: 0; z-index: 6;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 0 8vw;
    background: var(--room);
    transition: opacity 1.6s ease;
  }
  #card.gone { opacity: 0; pointer-events: none; }
  #card h1 {
    font-size: clamp(34px, 7vw, 64px);
    font-weight: 400; font-style: italic; letter-spacing: .02em;
  }
  #card h1::after {
    content: ""; display: block;
    width: 68px; height: 3px; margin: 22px auto 0;
    background: var(--concrete);
  }
  #card p {
    margin-top: 22px; font-size: 19px; color: var(--dim); max-width: 34em;
  }
  #card a { color: var(--concrete); }

  @media (max-width: 640px) {
    #caption { font-size: 17px; left: 14px; bottom: 14px; max-width: 70vw; }
    #grid { padding: 50px 12px 30px; }
    #grid-list { grid-template-columns: repeat(2, 1fr); gap: 16px 10px; }
    .cell > span { font-size: 13px; }
    .layer img { max-width: 96vw; max-height: 80vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .layer, #caption, #card, #grid { transition-duration: .25s; }
    .layer.on img { animation: none; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="graff.html">← the wall</a>
  <a href="index.html">studio</a>
  <a href="#" id="grid-link" title="see them all (G)">all walls</a>
</nav>
<div id="pause-dot">❚❚ paused</div>

<div id="stage">
  <div class="layer" id="layerA"><img alt=""></div>
  <div class="layer" id="layerB"><img alt=""></div>
</div>

<button class="turn" id="prev" aria-label="previous wall"></button>
<button class="turn" id="next" aria-label="next wall"></button>

<div id="grid" aria-hidden="true"><div id="grid-list"></div></div>

<div id="caption"></div>
<div id="counter"></div>

<div id="card">
  <h1>compendium</h1>
  <p id="card-msg">gathering the walls that survived…</p>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBFhPRrarZGldaVHuDgtm6htTM7HoHNz8I",
  authDomain: "griffgraff-baa46.firebaseapp.com",
  databaseURL: "https://griffgraff-baa46-default-rtdb.firebaseio.com",
  projectId: "griffgraff-baa46",
  storageBucket: "griffgraff-baa46.firebasestorage.app",
  messagingSenderId: "354313176929",
  appId: "1:354313176929:web:65aa8467f9aad220026720",
  measurementId: "G-7KC0BJ1LYG"
};

const HOLD_MS = 7000;          /* how long each wall hangs in the room */
const layers = [document.getElementById("layerA"), document.getElementById("layerB")];
const captionEl = document.getElementById("caption");
const counterEl = document.getElementById("counter");
const card = document.getElementById("card");
const cardMsg = document.getElementById("card-msg");

let entries = [];              /* { key, t, n, thumb } ascending by time */
let fullSrc = new Map();       /* key -> full jpeg dataURL (lazy) */
let getFull = null;            /* (key) => Promise<dataURL> */
let idx = -1, front = 0;
let timer = null, paused = false;

function fate(e) {
  const d = new Date(e.t);
  const date = d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  const isFinal = /-final$/.test(e.key);
  const marks = isFinal
    ? "buffed at " + e.n + " marks"
    : e.n + " marks";
  return date + " · <span class=\"fate\">" + marks + "</span>";
}

async function srcFor(e) {
  if (fullSrc.has(e.key)) return fullSrc.get(e.key);
  if (getFull) {
    try {
      const img = await getFull(e.key);
      if (img) { fullSrc.set(e.key, img); return img; }
    } catch (err) { /* fall through to thumb */ }
  }
  return e.thumb; /* better a soft image than a black room */
}

async function show(i, dir = 1) {
  if (!entries.length) return;
  idx = ((i % entries.length) + entries.length) % entries.length;
  const e = entries[idx];
  const back = 1 - front;
  const img = layers[back].querySelector("img");
  img.src = await srcFor(e);
  await (img.decode ? img.decode().catch(() => {}) : Promise.resolve());
  layers[back].classList.add("on");
  layers[front].classList.remove("on");
  front = back;
  captionEl.innerHTML = fate(e);
  captionEl.classList.add("on");
  counterEl.textContent = (idx + 1) + " / " + entries.length;
  /* warm the next slide while this one hangs */
  srcFor(entries[(idx + dir + entries.length) % entries.length]);
  arm();
}

function arm() {
  clearTimeout(timer);
  if (!paused && !gridOpen) timer = setTimeout(() => show(idx + 1), HOLD_MS);
}

/* ---- contact sheet: every surviving wall as a thumbnail ---- */
const gridEl = document.getElementById("grid");
const gridList = document.getElementById("grid-list");
let gridOpen = false, gridBuilt = false;
function buildGrid() {
  gridBuilt = true;
  entries.forEach((e, i) => {
    const b = document.createElement("button");
    b.className = "cell"; b.type = "button";
    const im = document.createElement("img");
    im.loading = "lazy"; im.alt = ""; im.src = e.thumb;
    const cap = document.createElement("span");
    cap.innerHTML = fate(e);
    b.append(im, cap);
    b.addEventListener("click", (ev) => { ev.stopPropagation(); closeGrid(i); });
    gridList.appendChild(b);
  });
}
function openGrid() {
  if (!entries.length || gridOpen) return;
  if (!gridBuilt) buildGrid();
  gridOpen = true;
  clearTimeout(timer);
  document.body.classList.add("grid");
  gridEl.classList.add("on");
  gridEl.setAttribute("aria-hidden", "false");
  [...gridList.children].forEach((c, i) => c.classList.toggle("cur", i === idx));
  const cur = gridList.children[idx];
  if (cur) { cur.scrollIntoView({ block: "center" }); cur.focus({ preventScroll: true }); }
}
/* i = the wall to go to; leave it out to return to the one that was showing */
function closeGrid(i) {
  if (!gridOpen) return;
  gridOpen = false;
  document.body.classList.remove("grid");
  gridEl.classList.remove("on");
  gridEl.setAttribute("aria-hidden", "true");
  if (i != null && i !== idx) show(i); else arm();
}
gridEl.addEventListener("click", () => closeGrid()); /* the dark between thumbnails = back to the slide */
document.getElementById("grid-link").addEventListener("click", (e) => { e.preventDefault(); gridOpen ? closeGrid() : openGrid(); });
/* a click on the slide turns the page; a click on the dark around it opens the sheet */
function offSlide(e) {
  if (e.detail === 0) return false; /* keyboard-activated button */
  const r = layers[front].querySelector("img").getBoundingClientRect();
  if (!r.width) return false;
  return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
}
function setPaused(v) {
  paused = v;
  document.body.classList.toggle("paused", v);
  arm();
}

document.getElementById("next").addEventListener("click", (e) => offSlide(e) ? openGrid() : show(idx + 1));
document.getElementById("prev").addEventListener("click", (e) => offSlide(e) ? openGrid() : show(idx - 1, -1));
window.addEventListener("keydown", (e) => {
  if (e.key === "g" || e.key === "G") { gridOpen ? closeGrid() : openGrid(); return; }
  if (gridOpen) { /* arrows scroll the sheet, Enter opens the focused wall, Esc goes back to the slide */
    if (e.key === "Escape") { e.preventDefault(); closeGrid(); }
    return;
  }
  if (e.key === "ArrowRight") show(idx + 1);
  else if (e.key === "ArrowLeft") show(idx - 1, -1);
  else if (e.key === " " || e.code === "Space") { e.preventDefault(); setPaused(!paused); }
  else if (e.key === "Escape") { e.preventDefault(); location.href = "graff.html"; } /* back to the wall */
});

function emptyRoom() {
  cardMsg.innerHTML = "Nothing has survived yet. Walls enter the compendium at " +
    "100 marks — <a href=\"graff.html\">go make one live that long</a>.";
}
function darkRoom(err) {
  cardMsg.textContent = "Couldn't reach the archive (" + err + "). Refresh to try again.";
}

async function load() {
  /* offline test hook */
  if (window.__TEST_ARCHIVE) {
    entries = window.__TEST_ARCHIVE.slice().sort((a, b) => a.t - b.t);
    getFull = (k) => Promise.resolve((entries.find(x => x.key === k) || {}).img);
    return;
  }
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getDatabase, ref, get } =
    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const db = getDatabase(initializeApp(firebaseConfig));
  const snap = await get(ref(db, "walls/main/archiveIndex"));
  snap.forEach((ch) => {
    const v = ch.val();
    if (v.hidden) return; /* curated out — stays in the database, off the wall of fame */
    entries.push({ key: ch.key, t: v.t || 0, n: v.n || 0, thumb: v.thumb || "" });
  });
  entries.sort((a, b) => a.t - b.t);
  getFull = async (k) => {
    const s = await get(ref(db, "walls/main/archive/" + k));
    return s.exists() ? s.val().img : null;
  };
}

load().then(() => {
  if (!entries.length) { emptyRoom(); return; }
  cardMsg.textContent = entries.length + (entries.length === 1 ? " wall survived" : " walls survived");
  setTimeout(() => { card.classList.add("gone"); show(0); }, 1800);
}).catch((err) => darkRoom(err.message || err));
</script>
</body>
</html>
