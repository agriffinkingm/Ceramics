<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>compendium — walls that survived</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --room: #0c0b09;        /* warm black projection room */
    --bone: #d8d2c4;        /* caption ink */
    --dim: #6f6a5e;
    --concrete: #b7b2a8;    /* the wall's own color */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--room);
    color: var(--bone);
    font-family: "Cormorant Garamond", Georgia, serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }

  /* ---- slides: two stacked layers crossfading ---- */
  #stage { position: fixed; inset: 0; }
  .layer {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  .layer.on { opacity: 1; }
  .layer img {
    max-width: 92vw; max-height: 84vh;
    object-fit: contain;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
  }
  /* whisper of ken burns while a slide is up */
  .layer.on img { animation: kb 9s ease-in-out forwards; }
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.035); } }

  /* ---- chrome ---- */
  .nav {
    position: fixed; top: 14px; left: 16px; z-index: 5;
    font-family: system-ui, sans-serif; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase;
  }
  .nav a { color: var(--dim); text-decoration: none; margin-right: 16px; }
  .nav a:hover, .nav a:focus-visible { color: var(--bone); }
  a:focus-visible, button:focus-visible { outline: 1px solid var(--concrete); outline-offset: 3px; }

  #caption {
    position: fixed; left: 20px; bottom: 18px; z-index: 5;
    font-size: 21px; font-style: italic; font-weight: 400;
    color: var(--bone);
    text-shadow: 0 1px 8px rgba(0,0,0,.8);
    opacity: 0; transition: opacity 1.4s ease;
  }
  #caption.on { opacity: 1; }
  #caption .fate { color: var(--concrete); }

  #counter {
    position: fixed; right: 20px; bottom: 20px; z-index: 5;
    font-family: system-ui, sans-serif; font-size: 10px;
    letter-spacing: .14em; color: var(--dim);
  }
  #pause-dot {
    position: fixed; right: 20px; top: 16px; z-index: 5;
    font-family: system-ui, sans-serif; font-size: 10px;
    letter-spacing: .14em; color: var(--dim);
    display: none;
  }
  body.paused #pause-dot { display: block; }

  /* invisible page-turn halves */
  .turn {
    position: fixed; top: 0; bottom: 0; width: 50%;
    background: none; border: none; z-index: 4; cursor: pointer;
  }
  #prev { left: 0; cursor: w-resize; }
  #next { right: 0; cursor: e-resize; }

  /* ---- title card / empty / error ---- */
  #card {
    position: fixed; inset: 0; z-index: 6;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 0 8vw;
    background: var(--room);
    transition: opacity 1.6s ease;
  }
  #card.gone { opacity: 0; pointer-events: none; }
  #card h1 {
    font-size: clamp(34px, 7vw, 64px);
    font-weight: 400; font-style: italic; letter-spacing: .02em;
  }
  #card h1::after {
    content: ""; display: block;
    width: 68px; height: 3px; margin: 22px auto 0;
    background: var(--concrete);
  }
  #card p {
    margin-top: 22px; font-size: 19px; color: var(--dim); max-width: 34em;
  }
  #card a { color: var(--concrete); }

  @media (max-width: 640px) {
    #caption { font-size: 17px; left: 14px; bottom: 14px; max-width: 70vw; }
    .layer img { max-width: 96vw; max-height: 80vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .layer, #caption, #card { transition-duration: .25s; }
    .layer.on img { animation: none; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="graff.html">← the wall</a>
  <a href="index.html">studio</a>
</nav>
<div id="pause-dot">❚❚ paused</div>

<div id="stage">
  <div class="layer" id="layerA"><img alt=""></div>
  <div class="layer" id="layerB"><img alt=""></div>
</div>

<button class="turn" id="prev" aria-label="previous wall"></button>
<button class="turn" id="next" aria-label="next wall"></button>

<div id="caption"></div>
<div id="counter"></div>

<div id="card">
  <h1>compendium</h1>
  <p id="card-msg">gathering the walls that survived…</p>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBFhPRrarZGldaVHuDgtm6htTM7HoHNz8I",
  authDomain: "griffgraff-baa46.firebaseapp.com",
  databaseURL: "https://griffgraff-baa46-default-rtdb.firebaseio.com",
  projectId: "griffgraff-baa46",
  storageBucket: "griffgraff-baa46.firebasestorage.app",
  messagingSenderId: "354313176929",
  appId: "1:354313176929:web:65aa8467f9aad220026720",
  measurementId: "G-7KC0BJ1LYG"
};

const HOLD_MS = 7000;          /* how long each wall hangs in the room */
const layers = [document.getElementById("layerA"), document.getElementById("layerB")];
const captionEl = document.getElementById("caption");
const counterEl = document.getElementById("counter");
const card = document.getElementById("card");
const cardMsg = document.getElementById("card-msg");

let entries = [];              /* { key, t, n, thumb } ascending by time */
let fullSrc = new Map();       /* key -> full jpeg dataURL (lazy) */
let getFull = null;            /* (key) => Promise<dataURL> */
let idx = -1, front = 0;
let timer = null, paused = false;

function fate(e) {
  const d = new Date(e.t);
  const date = d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  const isFinal = /-final$/.test(e.key);
  const marks = isFinal
    ? "buffed at " + e.n + " marks"
    : e.n + " marks · still growing";
  return date + " · <span class=\"fate\">" + marks + "</span>";
}

async function srcFor(e) {
  if (fullSrc.has(e.key)) return fullSrc.get(e.key);
  if (getFull) {
    try {
      const img = await getFull(e.key);
      if (img) { fullSrc.set(e.key, img); return img; }
    } catch (err) { /* fall through to thumb */ }
  }
  return e.thumb; /* better a soft image than a black room */
}

async function show(i, dir = 1) {
  if (!entries.length) return;
  idx = ((i % entries.length) + entries.length) % entries.length;
  const e = entries[idx];
  const back = 1 - front;
  const img = layers[back].querySelector("img");
  img.src = await srcFor(e);
  await (img.decode ? img.decode().catch(() => {}) : Promise.resolve());
  layers[back].classList.add("on");
  layers[front].classList.remove("on");
  front = back;
  captionEl.innerHTML = fate(e);
  captionEl.classList.add("on");
  counterEl.textContent = (idx + 1) + " / " + entries.length;
  /* warm the next slide while this one hangs */
  srcFor(entries[(idx + dir + entries.length) % entries.length]);
  arm();
}

function arm() {
  clearTimeout(timer);
  if (!paused) timer = setTimeout(() => show(idx + 1), HOLD_MS);
}
function setPaused(v) {
  paused = v;
  document.body.classList.toggle("paused", v);
  arm();
}

document.getElementById("next").addEventListener("click", () => show(idx + 1));
document.getElementById("prev").addEventListener("click", () => show(idx - 1, -1));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") show(idx + 1);
  else if (e.key === "ArrowLeft") show(idx - 1, -1);
  else if (e.key === " ") { e.preventDefault(); setPaused(!paused); }
});

function emptyRoom() {
  cardMsg.innerHTML = "Nothing has survived yet. Walls enter the compendium at " +
    "222 marks — <a href=\"graff.html\">go make one live that long</a>.";
}
function darkRoom(err) {
  cardMsg.textContent = "Couldn't reach the archive (" + err + "). Refresh to try again.";
}

async function load() {
  /* offline test hook */
  if (window.__TEST_ARCHIVE) {
    entries = window.__TEST_ARCHIVE.slice().sort((a, b) => a.t - b.t);
    getFull = (k) => Promise.resolve((entries.find(x => x.key === k) || {}).img);
    return;
  }
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getDatabase, ref, get } =
    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const db = getDatabase(initializeApp(firebaseConfig));
  const snap = await get(ref(db, "walls/main/archiveIndex"));
  snap.forEach((ch) => {
    const v = ch.val();
    entries.push({ key: ch.key, t: v.t || 0, n: v.n || 0, thumb: v.thumb || "" });
  });
  entries.sort((a, b) => a.t - b.t);
  getFull = async (k) => {
    const s = await get(ref(db, "walls/main/archive/" + k));
    return s.exists() ? s.val().img : null;
  };
}

load().then(() => {
  if (!entries.length) { emptyRoom(); return; }
  cardMsg.textContent = entries.length + (entries.length === 1 ? " wall survived" : " walls survived");
  setTimeout(() => { card.classList.add("gone"); show(0); }, 1800);
}).catch((err) => darkRoom(err.message || err));
</script>
</body>
</html>
